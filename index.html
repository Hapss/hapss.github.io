<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Архив сюжета Houkai Gakuen 2 (Guns Girl Z) на русском языке." />
    <title>Архив сюжета Houkai Gakuen 2</title>
    <link rel="icon" type="image/ico" href="images/favico.ico">
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        /* ==================================================================== */
        /* === Цветовые переменные (Dark Theme - по умолчанию) === */
        /* ==================================================================== */
        :root, .dark-theme {
            /* Фоновые цвета */
            --color-bg-darkest: #171c26; /* Для заголовка и истории */
            --color-bg-main: #1f2937;    /* Основной фон/элементы (VN Viewer default) */
            --color-bg-medium: #374151;  /* Панель управления/Фон элемента истории */
            --color-bg-dialogue: #1f2937; /* Цвет фона диалогового окна */
            
            /* Акценты */
            --color-accent-primary: #0891b2; 
            --color-accent-secondary: #0e7490; 
            --color-accent-ring: #22d3ee; 
            --color-warning-accent: #d946ef; 
            --color-warning-bg: #1e1b4b; 
            
            /* Текст */
            --color-text-primary: #e5e7eb; 
            --color-text-secondary: #d1d5db; 
            --color-text-vn: #e5e7eb; /* Цвет текста в диалоговом окне */
            
            /* Фиолетовый */
            --color-speaker-name: #ca7cfe; 
        }

        /* ==================================================================== */
        /* === Цветовые переменные (Light Theme) - ОБНОВЛЕНО === */
        /* ==================================================================== */
        .light-theme {
            --color-bg-darkest: #D7DDEA;  
            --color-bg-main: #F2F4F8;    
            --color-bg-medium: #E4E8F1;   
            --color-bg-dialogue: #1f2937; /* Идентично темной теме */
            
            --color-accent-primary: #2563eb; 
            --color-accent-secondary: #1d4ed8; 
            --color-accent-ring: #60a5fa; 
            
            /* Акцент для предупреждения */
            --color-warning-accent: #c026d3; 
            --color-warning-bg: #fce7f3; 
            
            /* Текст */
            --color-text-primary: #1f2937; 
            --color-text-secondary: #6b7280; 
            --color-text-vn: #e5e7eb; /* Идентично темной теме */
            
            --color-speaker-name: #ca7cfe; 
        }

        /* ==================================================================== */
        /* === Общие стили и привязка к переменным === */
        /* ==================================================================== */
        
        body, #vnViewer, .sprite-image {
            user-select: none;
            -webkit-user-select: none; 
            -moz-user-select: none;
            -ms-user-select: none;
            user-drag: none;
            -webkit-user-drag: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg-main); 
            color: var(--color-text-primary);
            transition: background-color 0.3s ease;
        }
        
        .vn-overlay {
            background-color: var(--color-bg-dialogue); 
            opacity: 0.9;
            backdrop-filter: blur(4px);
            color: var(--color-text-vn);
            border: 1px solid var(--color-bg-medium); 
        }
        
        .speaker-name {
            background-color: var(--color-bg-dialogue);
            color: var(--color-speaker-name); 
            padding: 4px 12px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            display: inline-block;
            font-weight: bold;
            /* Уменьшаем размер имени спикера на мобильных */
            font-size: 1rem; 
        }
        @media (min-width: 768px) {
            .speaker-name {
                font-size: 1.25rem; /* Восстанавливаем размер на десктопе */
            }
        }
        
        .load-button { background-color: var(--color-accent-primary); }
        .load-button:hover { background-color: var(--color-accent-secondary); }
        .alert-message { background-color: var(--color-accent-primary); }
        
        .warning-button {
            background-color: var(--color-warning-accent);
            color: var(--color-text-primary);
            transition: background-color 0.2s;
        }
        .warning-button:hover {
            background-color: var(--color-accent-primary); 
        }

        /* ==================================================================== */
        /* === АДАПТИВНЫЙ ДИАЛОГОВЫЙ БЛОК (MOBILE-FIRST) === */
        /* ==================================================================== */

        /* Wrapper, который центрирует и ограничивает ширину (Small Box) */
        #dialogueWrapper {
            /* На мобильных (по умолчанию) */
            width: 95%; /* Почти полная ширина экрана */
            max-width: 95%; 
        }

        @media (min-width: 1024px) {
            #dialogueWrapper {
                /* На десктопе */
                width: 900px;
                max-width: 900px;
            }
        }

        /* Контейнер текста (Small Box) */
        #dialogueContentBox { 
            /* Высота и отступы адаптированы */
            height: 150px; 
            padding: 1rem;
        }
        @media (min-width: 768px) {
            #dialogueContentBox {
                height: 200px; 
                padding: 2rem;
            }
        }

        /* Текст диалога (Small Box) */
        #currentText {
            /* Уменьшаем размер текста на мобильных */
            font-size: 1.125rem; /* text-lg */
        }
        @media (min-width: 768px) {
            #currentText {
                /* Восстанавливаем на десктопе */
                font-size: 1.25rem; /* text-xl */
            }
        }
        
        /* ==================================================================== */
        /* === ПОЛНОЭКРАННЫЙ ДИАЛОГОВЫЙ БЛОК (Full Dialogue Box) === */
        /* ==================================================================== */

        #fullDialogueBox {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30; /* Выше спрайтов, ниже заголовка */
            background-color: var(--color-bg-dialogue);
            opacity: 0.95; /* Небольшая прозрачность */
            transition: opacity 0.3s ease;
        }
        
        /* Внутренний контейнер для управления выравниванием */
        #fullDialogueContent {
            overflow-y: auto;
            padding: 2rem; /* Базовый отступ */
             color: var(--color-text-vn); /* Применяем цвет текста VN */
            /* Кастомный Scrollbar */
            scrollbar-width: thin; /* Firefox */
        }

        #fullDialogueContent::-webkit-scrollbar { width: 8px; }
        #fullDialogueContent::-webkit-scrollbar-track { background: var(--color-bg-darkest); border-radius: 10px; }
        #fullDialogueContent::-webkit-scrollbar-thumb { background: var(--color-accent-primary); border-radius: 10px; border: 2px solid var(--color-bg-darkest); }
        #fullDialogueContent::-webkit-scrollbar-thumb:hover { background: var(--color-accent-secondary); }

        /* Размеры текста */
        .full-text-sm { font-size: 1.1rem; }
        .full-text-md { font-size: 1.35rem; }
        .full-text-lg { font-size: 1.6rem; }

        /* Выравнивание текста: Слева сверху (по умолчанию) */
        .align-top-left { 
            justify-content: flex-start; /* Вертикально */
            align-items: flex-start;    /* Горизонтально */
            text-align: left;
        }
        
        /* Выравнивание текста: По центру */
        .align-center {
            justify-content: center;    /* Вертикально */
            align-items: center;       /* Горизонтально */
            text-align: center;
        }
        
        /* ==================================================================== */
        /* === СПРАЙТЫ И ФОН === */
        /* ==================================================================== */
        
        .sprite-position {
            position: absolute;
            bottom: -30%;
            width: 105%
            transition: opacity 0.5s ease; 
            z-index: 10;
            display: flex; 
            justify-content: center;
            align-items: flex-end;
        }
        @media (min-width: 768px) {
            .sprite-position {
                width: 90%;
                bottom: -30%;
            }
        }

        .sprite-position.left { left: 0; }
        .sprite-position.right { right: 0; }
        
        /* НОВОЕ: Стиль для центрального спрайта */
        .sprite-position.center {
            left: 50%;
            transform: translateX(-50%);
            bottom: -30%;
        }
        @media (min-width: 768px) {
            .sprite-position.center {
                width: 60%; /* Адаптивная ширина */
                bottom: -30%;
            }
        }
        
        .sprite-image {
            height: 100%; 
            width: auto;
            max-height: 100%; 
            object-fit: contain;
            display: block; 
            transition: opacity 0.3s ease, filter 0.3s ease; 
            opacity: 1; 
        }
        
        .dimmed-sprite {
            /* Установлено в 30% яркости и 30% серого, чтобы сохранить немного цвета */
            filter: brightness(0.3) grayscale(30%) !important; 
            opacity: 1 !important; 
        }
        
        .bg-layer {
            transition: opacity 1.0s ease; 
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }

        /* ==================================================================== */
        /* === ИСТОРИЯ ДИАЛОГОВ (ОК) === */
        /* ==================================================================== */
        
        #historyPanel.open {
            transform: translateX(0); 
        }
        #historyPanel {
            right: 0; 
            left: auto; 
            top: 0;
            transform: translateX(100%); 
            transition: transform 0.3s ease; 
            z-index: 50; 
            width: 100%; 
            max-width: 90vw; /* Почти полная ширина на мобильных */
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 768px) {
            #historyPanel {
                max-width: 400px; /* Фиксированная ширина на десктопе */
            }
        }
        
        #historyContent {
            flex-grow: 1; 
            overflow-y: auto; 
            padding-bottom: 2rem; 
        }
        
        /* Кастомный Scrollbar */
        #historyContent::-webkit-scrollbar { width: 8px; }
        #historyContent::-webkit-scrollbar-track { background: var(--color-bg-medium); border-radius: 10px; }
        #historyContent::-webkit-scrollbar-thumb { background: var(--color-accent-primary); border-radius: 10px; border: 2px solid var(--color-bg-darkest); }
        #historyContent::-webkit-scrollbar-thumb:hover { background: var(--color-accent-secondary); }

        /* Стили для регулятора громкости */
        #volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 5px;
            background: var(--color-bg-medium);
            border-radius: 5px;
            outline: none;
            transition: opacity 0.2s;
        }
        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--color-accent-ring);
            cursor: pointer;
            border-radius: 50%;
        }
         #volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--color-accent-ring);
            cursor: pointer;
            border-radius: 50%;
        }
    </style>
</head>
<body class="min-h-screen dark-theme">
    
    <!-- 1. Header Bar: Оптимизирован для мобильных -->
    <header id="header" class="fixed top-0 left-0 right-0 z-50 p-3 md:p-4 shadow-xl transition-colors duration-300" style="background-color: var(--color-bg-darkest);">
        <div class="flex flex-wrap justify-between items-center max-w-7xl mx-auto">
            <div class="flex items-center space-x-3">
                <h1 id="headerTitle" class="text-lg md:text-xl font-bold tracking-wider mb-2 md:mb-0" style="color: var(--color-text-primary);">Архив сюжета Houkai Gakuen 2</h1>
            </div>
            
            <div class="flex items-center space-x-2 md:space-x-4">
                 <!-- Кнопка Истории -->
                <button id="historyToggle" onclick="toggleHistory()" class="px-2 py-1 text-xs md:text-sm rounded-full transition duration-150" style="background-color: var(--color-bg-medium); color: var(--color-text-primary);">
                    <span id="historyText">История</span>
                </button>
                
                <!-- Кнопка смены темы -->
                <button id="themeToggle" onclick="toggleTheme()" class="px-2 py-1 text-xs md:text-sm rounded-full transition duration-150" style="background-color: var(--color-bg-medium); color: var(--color-text-primary);">
                    <span id="themeIcon">🌙</span> <span id="themeText">Тёмная</span>
                </button>

                <!-- Регулятор громкости -->
                <div id="volume-control-container" class="flex items-center space-x-2" style="background-color: var(--color-bg-medium); padding: 4px 8px; border-radius: 9999px;">
                    <button id="mute-button" onclick="toggleMute()" class="p-1 rounded-full transition-colors duration-150 hover:bg-[var(--color-bg-main)]">
                        <svg id="volume-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"> 
                            <!-- Path will be set by JS -->
                        </svg>
                    </button>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
                </div>
            </div>
        </div>
    </header>
    
    <!-- Панель Истории Диалогов (Адаптивная ширина в CSS) -->
    <div id="historyPanel" class="fixed top-0 h-full z-50 p-4 pt-20 shadow-2xl transition-transform duration-300" 
         style="background-color: var(--color-bg-darkest); opacity: 0.95;">
        <h2 id="historyTitle" class="text-xl font-bold mb-4" style="color: var(--color-text-primary);">История диалогов</h2>
        <div id="historyContent" class="space-y-3" style="height: calc(100% - 3.5rem);">
            <!-- History items here -->
        </div>
        <!-- Кнопка закрытия истории -->
        <button onclick="toggleHistory()" class="absolute top-4 right-4 text-xl p-2 rounded-full hover:bg-gray-700 transition" style="color: var(--color-text-primary);">
            &times;
        </button>
    </div>

    <!-- 2. Main Content Area -->
    <main id="mainContent" class="pt-[6rem] md:pt-20 pb-4 px-2 md:px-4 max-w-7xl mx-auto min-h-screen">
        
        <!-- Controls Panel: Использует flex-wrap для мобильных -->
        <div class="control-panel p-4 rounded-xl shadow-lg mb-6 flex flex-wrap gap-3 md:gap-4 items-end transition-colors duration-300" style="background-color: var(--color-bg-medium);">
            <!-- Выбор Типа Сюжета -->
            <div class="flex-1 min-w-[45%] md:min-w-[180px]">
                <label for="storyTypeSelect" id="labelStoryType" class="block text-sm font-medium mb-1" style="color: var(--color-text-secondary);">Тип сюжета</label>
                <!-- Использование обновленной функции для обработки изменений типа -->
                <select id="storyTypeSelect" onchange="updateArcAndChapterUI()" class="select-field w-full rounded-lg p-2.5 cursor-pointer focus:ring-4 transition text-sm" style="background-color: var(--color-bg-main);">
                    <!-- Options populated by JS -->
                </select>
            </div>

            <!-- Выбор Арки -->
            <div id="arcSelectContainer" class="flex-1 min-w-[45%] md:min-w-[180px] hidden">
                <label for="arcSelect" id="labelArc" class="block text-sm font-medium mb-1" style="color: var(--color-text-secondary);">Арка</label>
                 <!-- Вызов обновления глав при изменении арки -->
                <select id="arcSelect" onchange="updateChapterSelect()" class="select-field w-full rounded-lg p-2.5 cursor-pointer focus:ring-4 transition text-sm" style="background-color: var(--color-bg-main);">
                    <!-- Options populated by JS -->
                </select>
            </div>

            <!-- Выбор Главы -->
            <div class="w-full md:flex-1 md:min-w-[250px]">
                <label for="chapterSelect" id="labelChapter" class="block text-sm font-medium mb-1" style="color: var(--color-text-secondary);"></label>
                <select id="chapterSelect" onchange="enableLoadButton()" class="select-field w-full rounded-lg p-2.5 cursor-pointer focus:ring-4 transition text-sm" disabled style="background-color: var(--color-bg-main);">
                    <!-- Options populated by JS -->
                </select>
            </div>
            
            <!-- Кнопка загрузки -->
            <button id="loadButton" onclick="updateStoryContent()" class="w-full md:w-auto min-w-[120px] load-button text-white font-bold py-2.5 px-4 rounded-lg shadow-md transition duration-150 disabled:opacity-50 text-sm md:text-base" disabled>
                <span id="loadText">Загрузить</span>
            </button>
        </div>

        <!-- 3. Visual Novel Viewer (Main View) -->
        <div id="vnViewer" class="relative w-full aspect-[16/9] rounded-xl shadow-2xl overflow-hidden flex flex-col justify-end transition-colors duration-500 cursor-pointer" 
             style="min-height: 400px; background-color: var(--color-bg-main);"
             onclick="navigateDialogue(1)"> 
            
            <!-- Background Layers Container -->
            <div id="backgroundContainer" class="absolute inset-0 z-0">
                <div id="bgLayer1" class="absolute inset-0 bg-layer opacity-100"></div>
                <div id="bgLayer2" class="absolute inset-0 bg-layer opacity-0"></div>
            </div>

            <!-- Sprite Container -->
            <div id="spriteContainer" class="absolute inset-0 z-10 pointer-events-none flex justify-center items-end p-2 md:p-4">
                
                <div id="spriteLeftContainer" class="sprite-position left hidden">
                    <img id="spriteLeft" class="sprite-image" src="" alt="Левый персонаж" ondragstart="return false;">
                </div>
                
                <!-- НОВЫЙ: Контейнер центрального спрайта -->
                <div id="spriteCenterContainer" class="sprite-position center hidden">
                    <img id="spriteCenter" class="sprite-image" src="" alt="Центральный персонаж" ondragstart="return false;">
                </div>
                
                <div id="spriteRightContainer" class="sprite-position right hidden">
                    <img id="spriteRight" class="sprite-image" src="" alt="Правый персонаж" ondragstart="return false;">
                </div>
            </div>

            <!-- 3a. Small Dialogue Wrapper (Original) -->
            <div id="dialogueWrapper" class="absolute bottom-2 md:bottom-4 left-1/2 -translate-x-1/2 z-20 transition-all duration-300 opacity-100 hidden">
                
                <!-- Speaker Name Container -->
                <div id="speakerNameContainer" class="text-left mb-0 ml-4 md:ml-8"> 
                    <div id="currentSpeaker" class="speaker-name rounded-t-lg rounded-b-none"></div>
                </div>
                
                <!-- Dialogue Text Content Box (height and padding are adaptive in CSS) -->
                <div id="dialogueContentBox" 
                    class="vn-overlay rounded-xl shadow-2xl overflow-hidden flex items-start justify-start text-left"> 
                    <!-- Использует innerHTML для поддержки <br> -->
                    <p id="currentText" class="leading-tight transition-opacity duration-300"></p>
                </div>
            </div>

            <!-- 3b. Full Dialogue Box (New) -->
            <div id="fullDialogueBox" class="hidden">
                <!-- Inner content to handle flex alignment -->
                <div id="fullDialogueContent" class="h-full w-full flex flex-col p-4 md:p-8">
                    <!-- Использует innerHTML для поддержки <br> -->
                    <p id="fullCurrentText" class="leading-relaxed transition-opacity duration-300"></p>
                </div>
            </div>
            
            <!-- НОВОЕ: Индикатор загрузки главы -->
            <div id="chapter-load-overlay" class="absolute inset-0 z-40 flex flex-col items-center justify-center transition-opacity duration-300 hidden" style="background-color: rgba(23, 28, 38, 0.9);">
                <div class="w-12 h-12 border-4 border-t-transparent border-cyan-400 rounded-full animate-spin"></div>
                <p id="chapter-load-progress" class="mt-4 text-white font-mono text-lg"></p>
            </div>
            
        </div>
    </main>
    
    <!-- 4. Полноэкранное предупреждение (Modal Overlay) -->
    <div id="warning-overlay" class="fixed inset-0 z-[100] bg-gray-900/95 flex items-center justify-center p-4 md:p-8 transition-opacity duration-500 opacity-100">
        
        <!-- Карточка предупреждения: увеличена ширина до lg:max-w-4xl для ПК -->
        <div id="warning-card" class="p-8 md:p-12 rounded-3xl shadow-2xl max-w-sm lg:max-w-4xl w-full text-center 
                    transform scale-100 transition-transform duration-300 border-2" 
                    style="background-color: var(--color-warning-bg); border-color: var(--color-warning-accent); color: var(--color-text-primary);">

            <h1 id="warningTitleText" class="text-4xl md:text-7xl font-extrabold mb-6 select-none tracking-tight" 
                style="color: var(--color-warning-accent);">
                ПРИМЕЧАНИЕ
            </h1>

            <!-- Основной текст предупреждения -->
            <p class="text-base md:text-xl mb-3 font-medium leading-relaxed" 
               style="color: var(--color-text-secondary);">
                Это фанатский архив сюжета Guns Girl Z (Honkai Gakuen 2). Все права принадлежат miHoYo.
            </p>

            <!-- Добавленные строки -->
            <p class="text-sm md:text-base mb-1 font-medium" 
               style="color: var(--color-text-secondary);">
                Перевод выполнен Haps.
            </p>
            <p class="text-sm md:text-base mb-8 font-medium" 
               style="color: var(--color-text-secondary);">
                Сайт разработан с помощью Gemini.
            </p>

            <!-- Кнопка закрытия -->
            <button id="close-warning-button" 
                    class="warning-button font-bold py-3 px-8 text-base md:text-lg rounded-full 
                           transition duration-200 ease-in-out shadow-xl hover:shadow-2xl 
                           focus:outline-none focus:ring-4" 
                           style="background-color: var(--color-warning-accent);">
                Закрыть
            </button>
        </div>
    </div>

    <script>
        // ====================================================================
        // === КОНФИГУРАЦИЯ И ДАННЫЕ ===
        // ====================================================================
        
        const CONFIG = {
            PATHS: {
                SPRITE_BASE: 'images/sprites/',
                BACKGROUND_BASE: 'images/background/',
                AUDIO_BASE: 'audio/', // Путь к аудиофайлам
                METADATA_FILE: 'story/story_metadata.json', 
                STORY_BASE: 'story/ru/', // Путь к главам жестко задан для русского языка
            },
            STORAGE: {
                THEME_KEY: 'vn_theme',
                WARNING_KEY: 'vn_warning_dismissed',
                VOLUME_KEY: 'vn_volume', // Ключ для хранения громкости
                MUTE_KEY: 'vn_muted',    // Ключ для хранения состояния Mute
            },
            BACKOFF: {
                INITIAL_DELAY_MS: 750,  
                MAX_DELAY_MS: 7500,     
                MAX_ATTEMPTS: 3,        
            },
            PLACEHOLDERS: {
                DEFAULT_BG_COLOR: '#1f2937', // Используется как маркер, а не как прямой цвет
            }
        };
        
        /**
         * ИСПРАВЛЕНИЕ: Перемещаем spritePath в глобальную область.
         * Это исправляет 'ReferenceError: spritePath is not defined', 
         * так как функция теперь доступна и для 'updateStoryContent' 
         * (для предзагрузки), и для 'renderDialogueStep' (для отображения).
         */
        const spritePath = (fileName) => {
            if (!fileName) return ""; // Защита от null/undefined
            return `${CONFIG.PATHS.SPRITE_BASE}${encodeURIComponent(fileName)}`;
        };

        const STORY_GROUPS = {

        // ====================================================================

        function loadImage(url) {
            if (preloadedAssets[url]) {
                return preloadedAssets[url];
            }

            const promise = new Promise((resolve, reject) => {
                const img = new Image();
                
                img.onload = () => {
                    resolve(img);
                };
                
                img.onerror = () => {
                    console.warn(`[Preload] Ошибка загрузки: ${url}`);
                    reject(new Error(`Failed to load image: ${url}`)); 
                };

                img.src = url; 
            });

            preloadedAssets[url] = promise;
            return promise;
        }

        /**
         * ОБНОВЛЕНО: Переименовано с preloadSfx -> preloadAudioBuffer
         * Загружает ЛЮБОЙ аудиофайл (BGM или SFX) и декодирует его в AudioBuffer.
         */
        async function preloadAudioBuffer(url) {
            if (preloadedAssets[url]) {
                return preloadedAssets[url];
            }
            
            // Гарантируем, что_контекст_есть
            initAudioContext();
            if (!audioContext) {
                console.warn("[Preload Audio] AudioContext не готов. Аудио может_не_работать.");
                return Promise.reject(new Error("AudioContext not ready"));
            }

            const promise = (async () => {
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                    
                    const arrayBuffer = await response.arrayBuffer();
                    
                    // decodeAudioData - асинхронный (возвращает Promise)
                    const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                    return audioBuffer;
                } catch (e) {
                    console.warn(`[Preload Audio] Ошибка загрузки/декодирования: ${url}`, e);
                    // Удаляем "сломанный" promise из кэша, чтобы можно было_попробовать_снова
                    delete preloadedAssets[url]; 
                    throw new Error(`Failed to load/decode Audio: ${url}`);
                }
            })();

            preloadedAssets[url] = promise;
            return promise;
        }

        async function preloadAssets(index) {
            if (index < 0 || index >= currentDialogue.length) return Promise.resolve([]);
            
            const step = currentDialogue[index];
            const loadPromises = [];
            
            if (step.background) {
                const bgUrl = CONFIG.PATHS.BACKGROUND_BASE + encodeURIComponent(step.background);
                loadPromises.push(loadImage(bgUrl).catch(() => null)); 
            }
            
            if (step.sprite_left) {
                const spriteUrl = spritePath(step.sprite_left);
                loadPromises.push(loadImage(spriteUrl).catch(() => null));
            }
            
            if (step.sprite_right) {
                const spriteUrl = spritePath(step.sprite_right);
                loadPromises.push(loadImage(spriteUrl).catch(() => null));
            }

            if (step.sprite_centre) {
                const spriteUrl = spritePath(step.sprite_centre);
                loadPromises.push(loadImage(spriteUrl).catch(() => null));
            }
            // SFX не добавляем в preloader, т.к. он основан на new Image()

            return Promise.all(loadPromises);
        }

        /**
         * НОВАЯ ФУНКЦИЯ: Инициализирует Web Audio API.
         * Должна вызываться при первом взаимодействии пользователя (клик).
         */
        function initAudioContext() {
            // Если контекст уже создан и работает, выходим
            if (audioContext && audioContext.state === 'running') return;
            
            try {
                if (!audioContext) {
                    window.AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioContext = new AudioContext();
                    
                    // --- Создаем микшер для SFX ---
                    sfxGainNode = audioContext.createGain();
                    sfxGainNode.gain.value = isMuted ? 0 : userVolume;
                    sfxGainNode.connect(audioContext.destination);

                    // --- НОВОЕ: Создаем микшер для BGM ---
                    bgmGainNode = audioContext.createGain();
                    bgmGainNode.gain.value = isMuted ? 0 : userVolume;
                    bgmGainNode.connect(audioContext.destination);

                    console.log("[AudioContext] Web Audio API инициализирован (BGM + SFX).");
                }
                
                // Возобновление_контекста, если он "завис" (требуется в Chrome/Safari)
                if (audioContext.state === 'suspended') {
                    audioContext.resume().then(() => {
                         console.log("[AudioContext] Контекст возобновлен.");
                    });
                }
            } catch (e) {
                console.error("[AudioContext] Web Audio API не поддерживается или не удалось_создать_контекст.", e);
            }
        }
        
        // --- ОБНОВЛЕНО: Стандартные иконки громкости (Heroicons outline) ---

            // Volume Down
            volumeLow: 'M13.536 12a3 3 0 01-4.243 0M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z',
             // Volume Off
            volumeMuted: 'M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z M17 14l-2-2m0 0l-2-2m2 2l2-2m-2 2l2 2'

        /**
         * НОВАЯ ФУНКЦИЯ: Плавное изменение громкости для узла GainNode.
         * Заменяет старую функцию fadeAudio.
         */
        function fadeAudioNode(gainNode, targetVolume, duration = 500) {
            if (!gainNode || !audioContext) return Promise.resolve();
            
            const now = audioContext.currentTime;
            
            return new Promise(resolve => {
                // Плавное (линейное) изменение громкости
                gainNode.gain.cancelScheduledValues(now); // Отменяем предыдущие fade
                gainNode.gain.setValueAtTime(gainNode.gain.value, now); // Начинаем с текущего значения
                gainNode.gain.linearRampToValueAtTime(targetVolume, now + (duration / 1000));
                
                // Запускаем таймер, чтобы разрешить Promise после завершения fade
                setTimeout(resolve, duration);
            });
        }

        /**
         * НОВАЯ ФУНКЦИЯ: Останавливает текущий SFX.
         * Решает проблему наложения (Problem 3).
         */
        function stopAllSfx() {
            if (currentSfxSource) {
                try {
                    currentSfxSource.stop(0);
                    currentSfxSource.disconnect();
                } catch (e) {
                    // Ошибка может возникнуть, если звук уже остановлен
                }
                currentSfxSource = null;
            }
        }

        /**
         * ПЕРЕПИСАНО: handleAudio (BGM) теперь использует Web Audio API.
         * Это решит проблему прерывания (Problem 1).
         */
        async function handleAudio(audioFile) {
            // 0. Инициализация
            initAudioContext();
            if (!audioContext || !bgmGainNode) return;

            const newAudioUrl = audioFile ? `${CONFIG.PATHS.AUDIO_BASE}${encodeURIComponent(audioFile)}` : null;

            if (newAudioUrl === currentAudioUrl) return;

            console.log(`[Audio] BGM Transition from "${currentAudioUrl || 'none'}" to "${newAudioUrl || 'none'}"`);
            
            // 1. Fade out и остановка текущего BGM
            if (currentBgmSource) {
                await fadeAudioNode(bgmGainNode, 0, 500); // Fade out
                
                try {
                    currentBgmSource.stop(0);
                    currentBgmSource.disconnect();
                } catch (e) { /* Игнорируем ошибки остановки */ }
                
                currentBgmSource = null;
            }
            // Если BGM не было, убедимся, что громкость на 0
            bgmGainNode.gain.setValueAtTime(0, audioContext.currentTime);

            currentAudioUrl = newAudioUrl;

            // 2. Загрузка и fade in нового BGM
            if (newAudioUrl) {
                try {
                    // Используем наш универсальный загрузчик
                    const audioBuffer = await preloadAudioBuffer(newAudioUrl);
                    
                    const newSource = audioContext.createBufferSource();
                    newSource.buffer = audioBuffer;
                    newSource.loop = true; // BGM всегда зациклен
                    newSource.connect(bgmGainNode); // Подключаем к микшеру BGM
                    newSource.start(0);
                    
                    currentBgmSource = newSource; // Сохраняем ссылку

                    // 3. Fade in
                    // ОБНОВЛЕНИЕ: Громкость по умолчанию (не мьютим, если только нет isMuted)
                    const targetVol = isMuted ? 0 : userVolume;
                    await fadeAudioNode(bgmGainNode, targetVol, 500); // Fade in
                    
                } catch (e) {
                    console.warn(`[Audio] BGM Playback failed for ${newAudioUrl}.`, e);
                    currentAudioUrl = null;
                }
            }
        }
        
        /**
         * ОБНОВЛЕНО: handleSfx
         * НЕ-async. Использует .then() для "fire-and-forget".
         * Исправляет_гонку_состояний (race condition), которая_вызывала_наложение (Symptoms 1, 2).
         * @param {string} sfxFile - Имя_аудиофайла_эффекта.
         * @param {number} dialogueIndex - Индекс диалога, который_запросил_этот_SFX.
         */
        function handleSfx(sfxFile, dialogueIndex) {
            if (!sfxFile) return;

            // Гарантируем, что_контекст_есть
            initAudioContext();
            if (!audioContext || !sfxGainNode) {
                console.warn(`[SFX] AudioContext не готов. Воспроизведение ${sfxFile} отменено.`);
                return;
            }

            const sfxUrl = `${CONFIG.PATHS.AUDIO_BASE}${encodeURIComponent(sfxFile)}`;

            // Не используем await. Запускаем и "забываем"
            preloadAudioBuffer(sfxUrl)
                .then(audioBuffer => {
                    // --- НАЧАЛО КРИТИЧЕСКОЙ СЕКЦИИ ---
                    // Этот код выполнится, когда_буфер_готов
                    
                    // НОВАЯ ПРОВЕРКА: Если мы уже переключили диалог, 
                    // пока этот звук загружался, не воспроизводим его.
                    // Это предотвращает воспроизведение "опоздавших" SFX.
                    if (dialogueIndex !== currentDialogueIndex) {
                        console.log(`[SFX] Воспроизведение ${sfxFile} отменено (диалог сменился).`);
                        return;
                    }
                    
                    if (!audioBuffer) {
                        throw new Error("AudioBuffer недействителен.");
                    }

                    // 1. Создаем и настраиваем источник
                    const source = audioContext.createBufferSource();
                    source.buffer = audioBuffer;
                    source.loop = false; // Решает проблему "вечного" проигрывания (Problem 2)
                    source.connect(sfxGainNode); 
                    
                    // 2. ОСТАНАВЛИВАЕМ ПРЕДЫДУЩИЙ SFX (если он еще_играет)
                    // Это_исправляет_гонку_состояний и наложение (Problem 1)
                    // Мы_делаем_это_прямо_перед_запуском_нового.
                    stopAllSfx();

                    // 3. Запускаем_новый_звук
                    source.start(0); 
                    
                    // 4. Сохраняем ссылку на НОВЫЙ источник
                    currentSfxSource = source;
                    
                    // 5. Очищаем ссылку, когда звук_закончится_сам
                    source.onended = () => {
                        if (currentSfxSource === source) {
                            currentSfxSource = null;
                        }
                    };
                    // --- КОНЕЦ КРИТИЧЕСКОЙ СЕКЦИИ ---

                })
                .catch(e => {
                    // Ошибка, скорее всего, из preloadAudioBuffer
                    console.error(`[SFX] Воспроизведение_эффекта_не_удалось: ${sfxUrl}`, e);
                    // Убедимся, что_если_что-то "зависло", оно_остановится
                    if (currentSfxSource && (!currentSfxSource.buffer || currentSfxSource.buffer.duration === 0)) {
                         stopAllSfx();
                    }
                });
        }

        function saveTheme(theme) {

        function applyTheme(theme) {
            const isDark = theme === 'dark';
            
            document.body.classList.toggle('light-theme', !isDark);
            document.body.classList.toggle('dark-theme', isDark);

            if (elements.themeIcon && elements.themeText) {
                elements.themeIcon.textContent = isDark ? '🌙' : '☀️';
                elements.themeText.textContent = isDark ? i18n.ru.themeDark : i18n.ru.themeLight;
            }
            
            // Обновление цвета карточки предупреждения при смене темы
            const card = document.getElementById('warning-card');
            if (card) {
                const style = getComputedStyle(document.body);
                const accentColor = style.getPropertyValue('--color-warning-accent').trim();
                const bgColor = style.getPropertyValue('--color-warning-bg').trim();
                const secondaryTextColor = style.getPropertyValue('--color-text-secondary').trim();
                
                card.style.backgroundColor = bgColor;
                card.style.borderColor = accentColor;
                
                // Используем ID для заголовка
                const warningTitleText = document.getElementById('warningTitleText');
                if (warningTitleText) warningTitleText.style.color = accentColor;
                
                card.querySelectorAll('p').forEach(p => p.style.color = secondaryTextColor);

                const closeButton = card.querySelector('#close-warning-button');
                closeButton.style.backgroundColor = accentColor;
                closeButton.style.color = 'white'; 
                
                const overlay = document.getElementById('warning-overlay');
                overlay.style.backgroundColor = isDark ? 'rgba(15, 23, 42, 0.95)' : 'rgba(241, 245, 249, 0.95)';
            }

            // Обновление цвета дефолтного фона VN
            if (currentBackgroundUrl === CONFIG.PLACEHOLDERS.DEFAULT_BG_COLOR) {
                 const style = getComputedStyle(document.body);
                 const themeBgColor = style.getPropertyValue('--color-bg-main').trim();
                 
                 const activeLayer = activeBgLayer === 1 ? elements.bgLayer1 : elements.bgLayer2;
                 const inactiveLayer = activeBgLayer === 1 ? elements.bgLayer2 : elements.bgLayer1;

                 activeLayer.style.backgroundColor = themeBgColor;
                 activeLayer.style.backgroundImage = 'none';
                 inactiveLayer.style.backgroundColor = themeBgColor;
                 inactiveLayer.style.backgroundImage = 'none';
            }
        }

        function toggleTheme() {

        }

        /**
         * ИСПРАВЛЕНИЕ: Добавлена отсутствующая функция.
         * Обрабатывает \n (перенос строки) в <br>.
         */
        function processTextForBreaks(text) {
            if (text === null || text === undefined) return '';
            return String(text).replace(/\n/g, '<br>');
        }

        /**
         * ИСПРАВЛЕНИЕ: Добавлена отсутствующая функция.
         * Парсит [color=...]...[/color] теги в <span>.
         */
        function parseColoredText(text) {
            if (text === null || text === undefined) return '';
            let safeText = String(text);

            // Regex для [color=...]...[/color] (нежадный)
            const colorRegex = /\[color=([^\]]+)\](.*?)\[\/color\]/gi;
            
            return safeText.replace(colorRegex, (match, color, innerText) => {
                // Базовая очистка цвета
                const safeColor = color.replace(/['"<>]/g, ''); 
                return `<span style="color: ${safeColor};">${innerText}</span>`;
            });
        }

        /**
         * ИСПРАВЛЕНИЕ: Добавлена отсутствующая функция.
         * Управляет загрузкой спрайтов в элементы <img>.
         */
        function loadSprite(url, imgElement, containerElement) {
            if (!url) {
                containerElement.classList.add('hidden');
                return;
            }
            
            // Не перезагружаем, если изображение уже то же самое и контейнер видим
            if (imgElement.src === url && !containerElement.classList.contains('hidden')) {
                return;
            }

            const needsReload = imgElement.src !== url;

            if (needsReload) {
                imgElement.src = url; 
            }
            
            imgElement.onload = () => {
                containerElement.classList.remove('hidden');
            };
            imgElement.onerror = () => {
                containerElement.classList.add('hidden'); 
                console.warn(`[Sprite Load] Не удалось загрузить спрайт: ${url}`);
            };

            // Если кэшировано или уже загружается, просто показываем
            // .complete может быть true для предзагруженных
            if (imgElement.complete && needsReload) {
                 containerElement.classList.remove('hidden');
            } else if (!needsReload) {
                 // Если src тот же, но контейнер был скрыт
                 containerElement.classList.remove('hidden');
            }
        }

        /**
         * ИСПРАВЛЕНИЕ: Добавлена отсутствующая функция.
         * Управляет плавным переходом фона.
         */
        function crossFadeBackground(newBackgroundFile) {
            const { bgLayer1, bgLayer2 } = elements;
            // Получаем актуальный цвет фона из CSS-переменной
            const themeBgColor = getComputedStyle(document.body).getPropertyValue('--color-bg-main').trim();

            if (!newBackgroundFile) {
                // Сброс на цвет темы
                const targetUrl = CONFIG.PLACEHOLDERS.DEFAULT_BG_COLOR;
                if (currentBackgroundUrl === targetUrl) return; // Уже сброшено
                
                currentBackgroundUrl = targetUrl;
                
                const activeLayer = (activeBgLayer === 1) ? bgLayer1 : bgLayer2;
                const inactiveLayer = (activeBgLayer === 1) ? bgLayer2 : bgLayer1;

                // Устанавливаем цвет на неактивный слой
                inactiveLayer.style.backgroundImage = 'none';
                inactiveLayer.style.backgroundColor = themeBgColor;

                activeLayer.style.opacity = '0';
                inactiveLayer.style.opacity = '1';
                activeBgLayer = (activeBgLayer === 1) ? 2 : 1;
            } else {
                // Переход на изображение
                const newBgUrl = CONFIG.PATHS.BACKGROUND_BASE + encodeURIComponent(newBackgroundFile);
                if (newBgUrl === currentBackgroundUrl) return; // Нет изменений

                currentBackgroundUrl = newBgUrl;

                const activeLayer = (activeBgLayer === 1) ? bgLayer1 : bgLayer2;
                const inactiveLayer = (activeBgLayer === 1) ? bgLayer2 : bgLayer1;

                // 1. Устанавливаем новое изображение на *неактивный* слой
                inactiveLayer.style.backgroundImage = `url("${newBgUrl}")`;
                inactiveLayer.style.backgroundColor = 'transparent'; // Убираем цвет фона

                // 2. Плавный переход
                activeLayer.style.opacity = '0';
                inactiveLayer.style.opacity = '1';

                // 3. Переключаем активный слой
                activeBgLayer = (activeBgLayer === 1) ? 2 : 1;
            }
        }

        function navigateDialogue(direction) {
            // ОБНОВЛЕНО: Добавлен флаг isNavigating для предотвращения двойных кликов
            if (isHistoryVisible || isNavigating) return;
            
            // НОВОЕ: Блокируем_повторные_вызовы
            isNavigating = true; 
            
            // НОВОЕ: Инициализируем AudioContext при клике (если еще не был)
            initAudioContext();
            
            // ИСПРАВЛЕНИЕ: Немедленно останавливаем_любой_играющий_SFX
            // с предыдущего шага, чтобы_предотвратить_наложение
            // или "повторное" воспроизведение.
            stopAllSfx();
            
            try { 
                if (!dialogueIsLoaded || currentDialogue.length === 0) return;
                
                const newIndex = currentDialogueIndex + direction;

                if (newIndex >= 0 && newIndex < currentDialogue.length) {
                    currentDialogueIndex = newIndex;
                    renderDialogueStep();
                    
                    if (direction > 0) { 
                        preloadAssets(currentDialogueIndex + 1);
                    }

                } else if (newIndex >= currentDialogue.length) {
                    alertMessage(i18n.ru.endOfStory);
                    currentDialogueIndex = currentDialogue.length - 1;
                    handleAudio(null); // Останавливаем музыку в конце истории
                } else {
                    alertMessage(i18n.ru.startOfStory);
                }
            } catch (e) {
                 console.error("[Dialogue Navigation] Ошибка переключения:", e);
                 alertMessage(i18n.ru.errorRender(e.message));
            } finally {
                // НОВОЕ: Разблокируем_вызовы_в_любом_случае
                isNavigating = false; 
            }
        }
        
        /**
         * ИСПРАВЛЕНИЕ: Добавлена_отсутствующая_строка 'function renderDialogueStep() {'
         * Это_было_причиной_синтаксической_ошибки 'Unexpected token }'.
         */
        function renderDialogueStep() {
            
            // ИСПРАВЛЕНИЕ: Восстановлена_полная_функция spritePath, заменяя_сломанный_плейсхолдер
            /* * ИСПРАВЛЕНИЕ 2: Удаляем локальное определение. 
             * Оно было перемещено в глобальную область (см. выше).
             */

            // Получение элементов (было удалено при ошибке)
            const { 
                dialogueWrapper, fullDialogueBox, currentSpeaker, speakerNameContainer, 
                currentText, fullDialogueContent, fullCurrentText,
                spriteLeftElement, spriteRightElement, spriteCenterElement,
                spriteLeftContainer, spriteRightContainer, spriteCenterContainer
            } = elements;
            
            // Проверка индекса (было удалено при ошибке)
            if (currentDialogueIndex < 0 || currentDialogueIndex >= currentDialogue.length) {
                console.warn(`[Render] Неверный_индекс_диалога: ${currentDialogueIndex}`);
                return; 
            }
            
            const step = currentDialogue[currentDialogueIndex];
            const isFullText = step.text_style === 'full';
            

            // --- НОВАЯ ЛОГИКА АУДИО (Pause/Resume) ---

            const hasSfx = !!step.sfx;
            const processBgm = 'audio' in step;

            // 1. Управление BGM (Смена трека)
            // Эта функция управляет ТОЛЬКО сменой, запуском или остановкой (audio: null) трека.
            if (processBgm) {
                handleAudio(step.audio);
            }

            // 2. Управление SFX и Паузой BGM
            if (hasSfx) {
                // Воспроизводим SFX
                handleSfx(step.sfx, currentDialogueIndex);
                
                // Ставим BGM на "паузу" (быстрое затухание до 0), если BGM в данный момент играет
                if (currentBgmSource) {
                    fadeAudioNode(bgmGainNode, 0, 100); // 100ms fade-out
                }
            } else {
                // SFX нет.
                // Возобновляем BGM (быстрое возвращение громкости), если BGM должен играть
                if (currentBgmSource) {
                    const targetVol = isMuted ? 0 : userVolume;
                    fadeAudioNode(bgmGainNode, targetVol, 100); // 100ms fade-in
                }
            }
            // --- КОНЕЦ НОВОЙ ЛОГИКИ АУДИО ---


            dialogueWrapper.classList.toggle('hidden', isFullText);
            fullDialogueBox.classList.toggle('hidden', !isFullText);
            
            // ИСПРАВЛЕНИЕ: Вызов добавленной функции crossFadeBackground
            if ('background' in step) { // Проверяем наличие ключа, включая null
                crossFadeBackground(step.background); 
            }

            // --- 3. Управление Спрайтами (Видимость и Загрузка) - ИСПРАВЛЕНО ---
            
            const newLeftSpriteFile = step.sprite_left || null;
            const newRightSpriteFile = step.sprite_right || null;
            const newCenterSpriteFile = step.sprite_centre || null;

            // Сброс затемнения перед расстановкой
            spriteLeftElement.classList.remove('dimmed-sprite');
            spriteRightElement.classList.remove('dimmed-sprite');
            spriteCenterElement.classList.remove('dimmed-sprite');

            // --- Логика отображения/скрытия ---
            // Центральный
            if (newCenterSpriteFile) {
                const url = spritePath(newCenterSpriteFile);
                loadSprite(url, spriteCenterElement, spriteCenterContainer); // ИСПРАВЛЕНИЕ: вызов loadSprite
            } else {
                 spriteCenterContainer.classList.add('hidden'); // Скрываем, если не указан
            }

            // Левый (показываем ТОЛЬКО если НЕТ центрального)
            if (!newCenterSpriteFile && newLeftSpriteFile) {
                 const url = spritePath(newLeftSpriteFile);
                 loadSprite(url, spriteLeftElement, spriteLeftContainer); // ИСПРАВЛЕНИЕ: вызов loadSprite
            } else {
                 spriteLeftContainer.classList.add('hidden'); // Скрываем, если есть центральный ИЛИ левый не указан
            }
            
            // Правый (показываем ТОЛЬКО если НЕТ центрального)
             if (!newCenterSpriteFile && newRightSpriteFile) {
                 const url = spritePath(newRightSpriteFile);
                 loadSprite(url, spriteRightElement, spriteRightContainer); // ИСПРАВЛЕНИЕ: вызов loadSprite
            } else {
                 spriteRightContainer.classList.add('hidden'); // Скрываем, если есть центральный ИЛИ правый не указан
            }
            
            // --- D. Логика Затемнения (Применяется *после* расстановки) ---
            
            let dimTargets = new Set(); // Используем Set для удобства
            const speakerPos = step.position ? step.position.toLowerCase() : null;
            
            if (step.dim_override && !isFullText) { 
                const overrideValue = step.dim_override.toLowerCase().replace(/\s/g, ''); // Убираем пробелы

                if (overrideValue === 'auto' && step.speaker && speakerPos) {
                    // Автоматическое затемнение: затемняем НЕ говорящих
                    if (speakerPos === 'left') dimTargets.add('center').add('right');
                    else if (speakerPos === 'right') dimTargets.add('center').add('left');
                    else if (speakerPos === 'center') dimTargets.add('left').add('right');
                } else if (overrideValue === 'all') {
                    dimTargets.add('left').add('center').add('right');
                } else if (overrideValue === 'both') { // Совместимость + синоним left,right
                    dimTargets.add('left').add('right');
                } else if (overrideValue !== 'none') {
                    // Разбираем строку с позициями через запятую
                    overrideValue.split(',').forEach(pos => {
                        if (['left', 'center', 'right'].includes(pos)) {
                            dimTargets.add(pos);
                        }
                    });
                }
                 // Если 'none', dimTargets останется пустым
            }

            // --- E. Применение затемнения к видимым спрайтам ---
            if (!isFullText) {
                // Затемнение левого
                if (dimTargets.has('left') && !spriteLeftContainer.classList.contains('hidden')) {
                    spriteLeftElement.classList.add('dimmed-sprite');
                }
                // Затемнение центрального
                if (dimTargets.has('center') && !spriteCenterContainer.classList.contains('hidden')) {
                    spriteCenterElement.classList.add('dimmed-sprite');
                }
                // Затемнение правого
                if (dimTargets.has('right') && !spriteRightContainer.classList.contains('hidden')) {
                    spriteRightElement.classList.add('dimmed-sprite');
                }
            }

            // --- 5. Рендеринг Текста (с парсингом цвета) ---
            if (isFullText) {
                // ИСПРАВЛЕНИЕ: вызов processTextForBreaks и parseColoredText
                fullCurrentText.innerHTML = parseColoredText(processTextForBreaks(step.text));
                
                const size = step.full_text_size || 'md';
                fullCurrentText.className = 'leading-relaxed transition-opacity duration-300'; // Сброс классов
                fullCurrentText.classList.add(`full-text-${size}`);
                
                const align = step.full_text_align || 'top-left';
                
                fullDialogueContent.classList.remove('align-top-left', 'align-center');
                fullDialogueContent.classList.add(align === 'center' ? 'align-center' : 'align-top-left');
                
                currentSpeaker.textContent = ""; 
                speakerNameContainer.classList.add('hidden');

            } else {
                if (step.speaker) {
                    currentSpeaker.textContent = step.speaker;
                    speakerNameContainer.classList.remove('hidden');
                } else {
                    currentSpeaker.textContent = "";
                    speakerNameContainer.classList.add('hidden');
                }
                
                // ИСПРАВЛЕНИЕ: вызов processTextForBreaks и parseColoredText
                currentText.innerHTML = parseColoredText(processTextForBreaks(step.text));
            }
            
            // 6. Обновление Истории
            if (isHistoryVisible) {
                renderHistory();
            }
        }
        
        async function updateStoryContent() {
            const fullStoryKey = elements.chapterSelect.value.trim();
            const { loadButton, loadText, chapterLoadOverlay, chapterLoadProgress } = elements;

            if (!fullStoryKey) return;

            // НОВОЕ: Инициализируем AudioContext при загрузке
            initAudioContext();

            // Остановка BGM
            await handleAudio(null);
            // НОВОЕ: Принудительная остановка SFX при загрузке главы
            stopAllSfx();

            loadButton.disabled = true;
            loadText.textContent = i18n.ru.loadingText;
            chapterLoadOverlay.classList.remove('hidden');
            chapterLoadProgress.textContent = `(0/?)`;

            const expectedFilePath = `${CONFIG.PATHS.STORY_BASE}${fullStoryKey}.json`;
            let chapterData;
            try {
                const response = await fetch(expectedFilePath);
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                chapterData = await response.json();
                if (!chapterData || !Array.isArray(chapterData.dialogue)) {
                    throw new Error("Неверный формат JSON: отсутствует массив 'dialogue'.");
                }
            } catch (error) {
                console.error(`[Content Load] Критическая ошибка при загрузке или парсинге JSON главы: ${expectedFilePath}`, error);
                alertMessage(i18n.ru.errorChapterNotFound);
                loadText.textContent = i18n.ru.loadText;
                loadButton.disabled = false;
                chapterLoadOverlay.classList.add('hidden');
                return;
            }

            // --- Сбор Ассетов (Только Изображения) ---
            const urlsToLoad = (() => {
                const uniqueUrls = new Set();
                for (const step of chapterData.dialogue) {
                    if (step.background) uniqueUrls.add(CONFIG.PATHS.BACKGROUND_BASE + encodeURIComponent(step.background));
                    if (step.sprite_left) uniqueUrls.add(spritePath(step.sprite_left));
                    if (step.sprite_right) uniqueUrls.add(spritePath(step.sprite_right));
                    if (step.sprite_centre) uniqueUrls.add(spritePath(step.sprite_centre)); 
                    // SFX и Audio (BGM) не добавляются в preloader изображений
                }
                return Array.from(uniqueUrls);
            })();

            const totalToLoad = urlsToLoad.length;
            chapterLoadProgress.textContent = `(0/${totalToLoad})`;

            if (totalToLoad > 0) {
                const BATCH_SIZE = 10;
                let loadedCount = 0;

                for (let i = 0; i < totalToLoad; i += BATCH_SIZE) {
                    const batch = urlsToLoad.slice(i, i + BATCH_SIZE);
                    const batchPromises = batch.map(url => loadImage(url).catch(err => console.warn(err)));
                    
                    await Promise.allSettled(batchPromises);

                    loadedCount += batch.length;
                    const progress = Math.min(loadedCount, totalToLoad);
                    chapterLoadProgress.textContent = `(${progress}/${totalToLoad})`;
                }
            }

            // --- НОВОЕ: Предзагрузка SFX ---
            // Мы запускаем их асинхронно и не ждем завершения,
            // чтобы не блокировать отображение главы.
            // К моменту, когда SFX понадобится, он, вероятно, будет в кэше.
            const sfxUrls = new Set();
            for (const step of chapterData.dialogue) {
                if (step.sfx) {
                    sfxUrls.add(CONFIG.PATHS.AUDIO_BASE + encodeURIComponent(step.sfx));
                }
            }
            
            if (sfxUrls.size > 0) {
                console.log(`[SFX Preload] Запуск предзагрузки для ${sfxUrls.size} SFX...`);
                // ОБНОВЛЕНО: используем preloadAudioBuffer
                const sfxPromises = Array.from(sfxUrls).map(url => preloadAudioBuffer(url).catch(e => null));
                
                // Мы не используем await, чтобы не блокировать UI
                Promise.allSettled(sfxPromises).then(results => {
                    const loaded = results.filter(r => r.status === 'fulfilled').length;
                    console.log(`[SFX Preload] Фоновая предзагрузка ${loaded}/${sfxUrls.size} SFX завершена.`);
                });
            }
            // --- Конец блока SFX ---

            currentDialogue = chapterData.dialogue;
            currentDialogueIndex = 0;
            dialogueIsLoaded = true;
            
            // Сброс состояния для чистой загрузки главы
            currentBackgroundUrl = null;
            // Сброс видимости спрайтов при загрузке новой главы
            elements.spriteLeftContainer.classList.add('hidden');
            elements.spriteRightContainer.classList.add('hidden');
            elements.spriteCenterContainer.classList.add('hidden'); 
            elements.spriteLeftElement.src = ''; // Очищаем src, чтобы триггернуть loadSprite
            elements.spriteRightElement.src = '';
            elements.spriteCenterElement.src = ''; 
            elements.fullDialogueBox.classList.add('hidden'); 
            
            // Сброс фона на дефолтный цвет
            const themeBgColor = getComputedStyle(document.body).getPropertyValue('--color-bg-main').trim();
            elements.bgLayer1.style.backgroundImage = 'none';
            elements.bgLayer1.style.backgroundColor = themeBgColor;
            elements.bgLayer1.style.opacity = '1';
            elements.bgLayer2.style.opacity = '0';
            elements.bgLayer2.style.backgroundImage = 'none';
            elements.bgLayer2.style.backgroundColor = themeBgColor;
            activeBgLayer = 1;
            currentBackgroundUrl = CONFIG.PLACEHOLDERS.DEFAULT_BG_COLOR;

            renderDialogueStep(); // Первый рендер

            chapterLoadOverlay.classList.add('hidden');
            loadText.textContent = i18n.ru.loadedText;
            setTimeout(() => {
                loadText.textContent = i18n.ru.loadText;
                loadButton.disabled = false;
            }, 1500);
        }

        // ====================================================================
        // === UI & I18N FUNCTIONS ===
        // ====================================================================

        function alertMessage(message) {
            const header = document.getElementById('header');
            if (!header) return; // Защита, если header не найден
            
            const msgBox = document.createElement('div');
            msgBox.textContent = message;
            msgBox.className = 'fixed top-1 right-1/2 translate-x-1/2 p-2 text-white rounded-lg shadow-xl z-50 text-sm transition-opacity duration-300 alert-message';
            
            // Позиционируем относительно хедера
            msgBox.style.top = `${header.offsetHeight + 10}px`; 
            
            document.body.appendChild(msgBox); // Добавляем в body, а не в header
            
            setTimeout(() => {
                msgBox.style.opacity = '0';
                setTimeout(() => msgBox.remove(), 300);
            }, 5000);
        }

        function updateI18nStrings() {
            const text = i18n.ru;
            
            document.getElementById('headerTitle').textContent = text.headerTitle;
            document.getElementById('labelStoryType').textContent = text.labelStoryType;
            document.getElementById('labelArc').textContent = text.labelArc; 
            document.getElementById('labelChapter').textContent = text.labelChapter;
            elements.loadText.textContent = text.loadText;
            elements.historyText.textContent = text.historyButton;
            elements.historyTitle.textContent = text.historyTitle;

            const currentTheme = document.body.classList.contains('dark-theme') ? 'dark' : 'light';
            elements.themeText.textContent = currentTheme === 'dark' ? text.themeDark : text.themeLight;

            const typeSelect = elements.storyTypeSelect;
            const currentType = typeSelect.value;
            typeSelect.innerHTML = ''; // Очистка перед добавлением

            for (const key in STORY_GROUPS) {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = STORY_GROUPS[key].ru; 
                if (key === currentType) { 
                    option.selected = true;
                }
                typeSelect.appendChild(option);
            }
             if (!currentType && typeSelect.options.length > 0) {
                 typeSelect.selectedIndex = 0; // Выбираем первую опцию, если ничего не было выбрано
             }
        }
        
        function updateArcAndChapterUI() {
            updateI18nStrings(); 
            
            const typeKey = elements.storyTypeSelect.value;
            const arcSelect = elements.arcSelect;
            const arcContainer = elements.arcSelectContainer;
            
            const currentArcKey = arcSelect.value; 
            
            arcSelect.innerHTML = ''; // Очистка
            arcSelect.disabled = true;
            if (typeKey !== 'main') {
                 arcSelect.value = ""; 
            }

            if (typeKey === 'main') {
                arcContainer.classList.remove('hidden');
                
                let arcFound = false;
                for (const key in MAIN_STORY_ARCS) {
                    const option = document.createElement('option');
                    option.value = key;
                    option.textContent = MAIN_STORY_ARCS[key].ru;
                    if (key === currentArcKey) { 
                        option.selected = true;
                    }
                    arcSelect.appendChild(option);
                    arcFound = true;
                }
                arcSelect.disabled = !arcFound;
                 if (!currentArcKey && arcSelect.options.length > 0) {
                     arcSelect.selectedIndex = 0; // Выбираем первую арку, если ничего не было выбрано
                 }

            } else {
                arcContainer.classList.add('hidden');
                arcSelect.value = ""; 
            }
            
            updateChapterSelect();
        }

        function updateChapterSelect() {
            const typeKey = elements.storyTypeSelect.value;
            const arcKey = elements.arcSelect.value;       
            const select = elements.chapterSelect;
            
            const currentChapterKey = select.value;

            select.innerHTML = ''; // Очистка
            select.disabled = true; 
            select.value = ""; 
            
            if (!window.storyMetadata) {
                enableLoadButton();
                return;
            }
            
            if (!typeKey || (typeKey === 'main' && !arcKey)) { 
                 enableLoadButton();
                 return;
            }
            
            const storyGroup = STORY_GROUPS[typeKey];
            if (!storyGroup) { 
                 enableLoadButton();
                 return;
            }
            
            let targetPrefix = (typeKey === 'main') ? `${arcKey}_main_` : storyGroup.prefix; 

            let chapterFound = false;
            
            for (const fullChapterKey in window.storyMetadata) {
                if (fullChapterKey.startsWith(targetPrefix)) {
                    
                    const chapterData = window.storyMetadata[fullChapterKey];
                    const chapterName = chapterData.ru;
                    
                    if (chapterName) {
                        const option = document.createElement('option');
                        option.value = fullChapterKey; 
                        option.textContent = chapterName; 
                        
                        if (fullChapterKey === currentChapterKey) {
                             option.selected = true;
                        }
                        select.appendChild(option);
                        chapterFound = true;
                    }
                }
            }
            
            select.disabled = !chapterFound;
            if (!currentChapterKey && select.options.length > 0) {
                select.selectedIndex = 0; // Выбираем первую главу, если ничего не было выбрано
            }
            
            enableLoadButton();
        }
        
        function initializeOrUpdateUI() {
             updateArcAndChapterUI(); 
             const currentTheme = document.body.classList.contains('dark-theme') ? 'dark' : 'light';
             applyTheme(currentTheme);
             enableLoadButton();
        }

        function enableLoadButton() {
            const storyId = elements.chapterSelect.value;
            elements.loadButton.disabled = !storyId; 
        }

        // ====================================================================
        // === УПРАВЛЕНИЕ ИСТОРИЕЙ ===
        // ====================================================================

        function toggleHistory() {
            isHistoryVisible = !isHistoryVisible;
            elements.historyPanel.classList.toggle('open', isHistoryVisible);
            
            if (isHistoryVisible) {
                setTimeout(renderHistory, 300); 
            }
        }

        function renderHistory() {
            const { historyContent } = elements;
            historyContent.innerHTML = '';
            
            if (!dialogueIsLoaded || currentDialogue.length === 0) {
                historyContent.innerHTML = `<p class="text-center mt-8 p-3 rounded-lg" style="color: var(--color-text-secondary); background-color: var(--color-bg-medium);">${i18n.ru.historyEmpty}</p>`;
                return;
            }
            
            const fragment = document.createDocumentFragment();

            for (let i = 0; i <= currentDialogueIndex; i++) {
                const step = currentDialogue[i];
                if (!step.text && !step.background && i !== 0) continue; 
                
                const isCurrent = (i === currentDialogueIndex);

                const historyItem = document.createElement('div');
                
                historyItem.className = `p-3 rounded-lg cursor-pointer transition duration-150 shadow-md border border-transparent`;
                
                if (isCurrent) {
                    historyItem.classList.add('ring-2', 'ring-offset-2');
                    historyItem.style.backgroundColor = 'var(--color-accent-primary)'; 
                    historyItem.style.color = 'white';
                    historyItem.style.borderColor = 'var(--color-accent-ring)';
                    historyItem.style.boxShadow = '0 0 10px rgba(0, 0, 0, 0.5)';
                    historyItem.style.fontWeight = 'bold';
                } else {
                    historyItem.style.backgroundColor = 'var(--color-bg-medium)'; 
                    historyItem.style.color = 'var(--color-text-primary)';
                }
                
                historyItem.dataset.index = i; 
                historyItem.onclick = () => {
                    // НОВОЕ: Инициализируем AudioContext при клике (если еще не был)
                    initAudioContext();
                    currentDialogueIndex = i;
                    renderDialogueStep();
                    toggleHistory(); 
                };

                let speakerNameText = step.speaker || '';
                
                if (speakerNameText) {
                    const speakerName = document.createElement('p');
                    speakerName.className = 'font-bold mb-1';
                    speakerName.style.color = isCurrent ? 'white' : 'var(--color-speaker-name)'; 
                    speakerName.textContent = speakerNameText;
                    historyItem.appendChild(speakerName);
                }

                const textContent = document.createElement('p');
                textContent.className = 'text-sm leading-snug';
                
                let displayText = step.text;
                if (!displayText && i === 0) {
                    displayText = i18n.ru.startOfStory;
                }
                
                // Используем parseColoredText и для истории, чтобы цвета отображались
                // ИСПРАВЛЕНИЕ: также добавляем processTextForBreaks
                textContent.innerHTML = parseColoredText(processTextForBreaks(displayText || '')); 
                historyItem.appendChild(textContent);

                fragment.appendChild(historyItem);
            }
            
            historyContent.appendChild(fragment);
            
            const currentItem = historyContent.querySelector(`[data-index="${currentDialogueIndex}"]`);
            if (currentItem) {
                currentItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    </script>
</body>
</html>
