<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Архив сюжета Houkai Gakuen 2 (Guns Girl Z) на русском языке." />
    <title>Архив сюжета Houkai Gakuen 2</title>
    <link rel="icon" type="image/ico" href="images/favico.ico">
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        /* === Цветовые переменные (Dark Theme - по умолчанию) === */
        :root, .dark-theme {
            --color-bg-darkest: #171c26;
            --color-bg-main: #1f2937;
            --color-bg-medium: #374151;
            --color-bg-dialogue: #1f2937;
            --color-accent-primary: #0891b2; 
            --color-accent-secondary: #0e7490; 
            --color-accent-ring: #22d3ee; 
            --color-warning-accent: #d946ef; 
            --color-warning-bg: #1e1b4b; 
            --color-text-primary: #e5e7eb; 
            --color-text-secondary: #d1d5db; 
            --color-text-vn: #e5e7eb;
            --color-speaker-name: #ca7cfe; 
        }

        /* === Цветовые переменные (Light Theme) === */
        .light-theme {
            --color-bg-darkest: #D7DDEA;  
            --color-bg-main: #F2F4F8;    
            --color-bg-medium: #E4E8F1;   
            --color-bg-dialogue: #1f2937;
            --color-accent-primary: #2563eb; 
            --color-accent-secondary: #1d4ed8; 
            --color-accent-ring: #60a5fa; 
            --color-warning-accent: #c026d3; 
            --color-warning-bg: #fce7f3; 
            --color-text-primary: #1f2937; 
            --color-text-secondary: #6b7280; 
            --color-text-vn: #e5e7eb;
            --color-speaker-name: #ca7cfe; 
        }

        /* === Общие стили === */
        body, #vnViewer, .sprite-image {
            user-select: none;
            -webkit-user-select: none; 
            -moz-user-select: none;
            -ms-user-select: none;
            user-drag: none;
            -webkit-user-drag: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg-main); 
            color: var(--color-text-primary);
            transition: background-color 0.3s ease;
        }
        
        .vn-overlay {
            background-color: var(--color-bg-dialogue); 
            opacity: 0.9;
            backdrop-filter: blur(4px);
            color: var(--color-text-vn);
            border: 1px solid var(--color-bg-medium); 
        }
        
        .speaker-name {
            background-color: var(--color-bg-dialogue);
            color: var(--color-speaker-name); 
            padding: 4px 12px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            display: inline-block;
            font-weight: bold;
            font-size: 1rem; 
        }
        @media (min-width: 768px) {
            .speaker-name {
                font-size: 1.25rem;
            }
        }
        
        .load-button { background-color: var(--color-accent-primary); }
        .load-button:hover { background-color: var(--color-accent-secondary); }
        .alert-message { background-color: var(--color-accent-primary); }
        
        .warning-button {
            background-color: var(--color-warning-accent);
            color: var(--color-text-primary);
            transition: background-color 0.2s;
        }
        .warning-button:hover {
            background-color: var(--color-accent-primary); 
        }

        /* === Адаптивный диалоговый блок === */
        #dialogueWrapper {
            width: 95%;
            max-width: 95%; 
        }

        @media (min-width: 1024px) {
            #dialogueWrapper {
                width: 900px;
                max-width: 900px;
            }
        }

        #dialogueContentBox { 
            height: 150px; 
            padding: 1rem;
        }
        @media (min-width: 768px) {
            #dialogueContentBox {
                height: 200px; 
                padding: 2rem;
            }
        }

        #currentText {
            font-size: 1.125rem;
        }
        @media (min-width: 768px) {
            #currentText {
                font-size: 1.25rem;
            }
        }
        
        /* === Полноэкранный диалоговый блок === */
        #fullDialogueBox {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            background-color: var(--color-bg-dialogue);
            opacity: 0.95;
            transition: opacity 0.3s ease;
        }
        
        #fullDialogueContent {
            overflow-y: auto;
            padding: 2rem;
            color: var(--color-text-vn);
            scrollbar-width: thin;
        }

        #fullDialogueContent::-webkit-scrollbar { width: 8px; }
        #fullDialogueContent::-webkit-scrollbar-track { background: var(--color-bg-darkest); border-radius: 10px; }
        #fullDialogueContent::-webkit-scrollbar-thumb { background: var(--color-accent-primary); border-radius: 10px; border: 2px solid var(--color-bg-darkest); }
        #fullDialogueContent::-webkit-scrollbar-thumb:hover { background: var(--color-accent-secondary); }

        .full-text-sm { font-size: 1.1rem; }
        .full-text-md { font-size: 1.35rem; }
        .full-text-lg { font-size: 1.6rem; }

        .align-top-left { 
            justify-content: flex-start;
            align-items: flex-start;
            text-align: left;
        }
        
        .align-center {
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        /* === Спрайты и Фон === */
        .sprite-position {
            position: absolute;
            height: 100%;
            bottom: -30%;
            transition: opacity 0.5s ease, transform 0.5s ease, left 0.5s ease, right 0.5s ease, bottom 0.5s ease; 
            z-index: 10;
            display: flex; 
            justify-content: center;
            align-items: flex-end;
        }

        .sprite-position.left { 
            left: 0; 
            width: 45%; 
        }
        .sprite-position.right { 
            right: 0; 
            width: 45%; 
        }
        
        .sprite-position.center {
            left: 50%;
            transform: translateX(-50%);
            width: 50%; 
        }
        
        .sprite-image {
            height: 100%; 
            width: auto;
            max-height: 100%; 
            object-fit: contain;
            display: block; 
            transition: opacity 0.3s ease, filter 0.3s ease; 
            opacity: 1; 
            transform: scale(1.4);
            transform-origin: bottom center;
        }
        
        .dimmed-sprite {
            filter: brightness(0.3) grayscale(30%) !important; 
            opacity: 1 !important; 
        }

        /* === ЭФФЕКТЫ И АНИМАЦИИ === */
        
        @keyframes shake-anim {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake {
            animation: shake-anim 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        .sprite-position.left.exit-left { transform: translateX(-100%) !important; opacity: 0 !important; }
        .sprite-position.left.exit-right { transform: translateX(200%) !important; opacity: 0 !important; }
        .sprite-position.left.exit-down { transform: translateY(100%) !important; opacity: 0 !important; }

        .sprite-position.right.exit-left { transform: translateX(-200%) !important; opacity: 0 !important; }
        .sprite-position.right.exit-right { transform: translateX(100%) !important; opacity: 0 !important; }
        .sprite-position.right.exit-down { transform: translateY(100%) !important; opacity: 0 !important; }

        .sprite-position.center.exit-left { transform: translate(-50%, 0) translateX(-200%) !important; opacity: 0 !important; }
        .sprite-position.center.exit-right { transform: translate(-50%, 0) translateX(200%) !important; opacity: 0 !important; }
        .sprite-position.center.exit-down { transform: translate(-50%, 100%) !important; opacity: 0 !important; }

        
        .bg-layer {
            transition: opacity 1.0s ease; 
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }

        /* === История диалогов === */
        #historyPanel.open {
            transform: translateX(0); 
        }
        #historyPanel {
            right: 0; 
            left: auto; 
            top: 0;
            transform: translateX(100%); 
            transition: transform 0.3s ease; 
            z-index: 50; 
            width: 100%; 
            max-width: 90vw;
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 768px) {
            #historyPanel {
                max-width: 400px;
            }
        }
        
        #historyContent {
            flex-grow: 1; 
            overflow-y: auto; 
            padding-bottom: 2rem; 
        }
        
        #historyContent::-webkit-scrollbar { width: 8px; }
        #historyContent::-webkit-scrollbar-track { background: var(--color-bg-medium); border-radius: 10px; }
        #historyContent::-webkit-scrollbar-thumb { background: var(--color-accent-primary); border-radius: 10px; border: 2px solid var(--color-bg-darkest); }
        #historyContent::-webkit-scrollbar-thumb:hover { background: var(--color-accent-secondary); }

        #volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 5px;
            background: var(--color-bg-medium);
            border-radius: 5px;
            outline: none;
            transition: opacity 0.2s;
        }
        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--color-accent-ring);
            cursor: pointer;
            border-radius: 50%;
        }
         #volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--color-accent-ring);
            cursor: pointer;
            border-radius: 50%;
        }

        /* === ПОЛНОЭКРАННЫЙ РЕЖИМ (Стилизация) === */
        /* Стили, применяемые только когда vnViewer в режиме Fullscreen API */
        #vnViewer:fullscreen {
            width: 100vw;
            height: 100vh;
            border-radius: 0; /* Убираем скругление в полном экране */
            /* Важно: в фуллскрине нужно сбросить aspect-ratio, чтобы заполнить весь экран */
            aspect-ratio: auto; 
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Сохраняем позиционирование диалога снизу */
            background-color: black; /* Фон на всякий случай */
        }
        
        /* Поддержка webkit для Safari */
        #vnViewer:-webkit-full-screen {
            width: 100%;
            height: 100%;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        /* Тултип для кнопки полноэкранного режима */
        .tooltip-text {
            visibility: hidden;
            background-color: var(--color-bg-medium);
            color: var(--color-text-primary);
            text-align: center;
            border-radius: 6px;
            padding: 5px 10px;
            position: absolute;
            z-index: 1;
            top: 125%; /* Позиция снизу кнопки */
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.75rem;
            white-space: nowrap;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            pointer-events: none;
        }

        .tooltip-container:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen dark-theme">
    
    <!-- Header -->
    <header id="header" class="fixed top-0 left-0 right-0 z-50 p-3 md:p-4 shadow-xl transition-colors duration-300" style="background-color: var(--color-bg-darkest);">
        <div class="flex flex-wrap justify-between items-center max-w-7xl mx-auto">
            <div class="flex items-center space-x-3">
                <!-- Кнопка Полноэкранного режима (Слева) -->
                <button id="fullscreenToggle" onclick="toggleFullscreen()" class="tooltip-container p-2 rounded-full transition-colors duration-150 hover:bg-[var(--color-bg-medium)] relative group" style="color: var(--color-text-primary);">
                    <!-- Иконка разворачивания (по умолчанию) -->
                    <svg id="icon-enter-fullscreen" class="w-6 h-6 block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                    </svg>
                    <!-- Иконка сворачивания (скрыта) -->
                    <svg id="icon-exit-fullscreen" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 14h4v4m0-4l-5 5m17-5h-4v4m0-4l5 5M4 10h4V6m0 4l-5-5m17 5h-4V6m0 4l5-5"></path>
                    </svg>
                    
                    <span id="fullscreen-tooltip-text" class="tooltip-text">Полноэкранный режим</span>
                </button>

                <h1 id="headerTitle" class="text-lg md:text-xl font-bold tracking-wider mb-2 md:mb-0" style="color: var(--color-text-primary);">Архив сюжета Houkai Gakuen 2</h1>
            </div>
            
            <div class="flex items-center space-x-2 md:space-x-4">
                <button id="historyToggle" onclick="toggleHistory()" class="px-2 py-1 text-xs md:text-sm rounded-full transition duration-150" style="background-color: var(--color-bg-medium); color: var(--color-text-primary);">
                    <span id="historyText">История</span>
                </button>
                
                <button id="themeToggle" onclick="toggleTheme()" class="px-2 py-1 text-xs md:text-sm rounded-full transition duration-150" style="background-color: var(--color-bg-medium); color: var(--color-text-primary);">
                    <span id="themeIcon">🌙</span> <span id="themeText">Тёмная</span>
                </button>

                <div id="volume-control-container" class="flex items-center space-x-2" style="background-color: var(--color-bg-medium); padding: 4px 8px; border-radius: 9999px;">
                    <button id="mute-button" onclick="toggleMute()" class="p-1 rounded-full transition-colors duration-150 hover:bg-[var(--color-bg-main)]">
                        <svg id="volume-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"></svg>
                    </button>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
                </div>
            </div>
        </div>
    </header>
    
    <!-- Панель Истории -->
    <div id="historyPanel" class="fixed top-0 h-full z-50 p-4 pt-20 shadow-2xl transition-transform duration-300" 
         style="background-color: var(--color-bg-darkest); opacity: 0.95;">
        <h2 id="historyTitle" class="text-xl font-bold mb-4" style="color: var(--color-text-primary);">История диалогов</h2>
        <div id="historyContent" class="space-y-3" style="height: calc(100% - 3.5rem);"></div>
        <button onclick="toggleHistory()" class="absolute top-4 right-4 text-xl p-2 rounded-full hover:bg-gray-700 transition" style="color: var(--color-text-primary);">
            &times;
        </button>
    </div>

    <!-- Main Content -->
    <main id="mainContent" class="pt-[6rem] md:pt-20 pb-4 px-2 md:px-4 max-w-7xl mx-auto min-h-screen">
        
        <div class="control-panel p-4 rounded-xl shadow-lg mb-6 flex flex-wrap gap-3 md:gap-4 items-end transition-colors duration-300" style="background-color: var(--color-bg-medium);">
            <div class="flex-1 min-w-[45%] md:min-w-[180px]">
                <label for="storyTypeSelect" id="labelStoryType" class="block text-sm font-medium mb-1" style="color: var(--color-text-secondary);">Тип сюжета</label>
                <select id="storyTypeSelect" onchange="updateArcAndChapterUI()" class="select-field w-full rounded-lg p-2.5 cursor-pointer focus:ring-4 transition text-sm" style="background-color: var(--color-bg-main);"></select>
            </div>

            <div id="arcSelectContainer" class="flex-1 min-w-[45%] md:min-w-[180px] hidden">
                <label for="arcSelect" id="labelArc" class="block text-sm font-medium mb-1" style="color: var(--color-text-secondary);">Арка</label>
                <select id="arcSelect" onchange="updateChapterSelect()" class="select-field w-full rounded-lg p-2.5 cursor-pointer focus:ring-4 transition text-sm" style="background-color: var(--color-bg-main);"></select>
            </div>

            <div class="w-full md:flex-1 md:min-w-[250px]">
                <label for="chapterSelect" id="labelChapter" class="block text-sm font-medium mb-1" style="color: var(--color-text-secondary);"></label>
                <select id="chapterSelect" onchange="enableLoadButton()" class="select-field w-full rounded-lg p-2.5 cursor-pointer focus:ring-4 transition text-sm" disabled style="background-color: var(--color-bg-main);"></select>
            </div>
            
            <button id="loadButton" onclick="updateStoryContent()" class="w-full md:w-auto min-w-[120px] load-button text-white font-bold py-2.5 px-4 rounded-lg shadow-md transition duration-150 disabled:opacity-50 text-sm md:text-base" disabled>
                <span id="loadText">Загрузить</span>
            </button>
        </div>

        <!-- Visual Novel Viewer -->
        <div id="vnViewer" class="relative w-full aspect-[16/9] rounded-xl shadow-2xl overflow-hidden flex flex-col justify-end transition-colors duration-500 cursor-pointer" 
             style="min-height: 400px; background-color: var(--color-bg-main);"
             onclick="navigateDialogue(1)"> 
            
            <div id="backgroundContainer" class="absolute inset-0 z-0">
                <div id="bgLayer1" class="absolute inset-0 bg-layer opacity-100"></div>
                <div id="bgLayer2" class="absolute inset-0 bg-layer opacity-0"></div>
            </div>

            <div id="spriteContainer" class="absolute inset-0 z-10 pointer-events-none flex justify-center items-end p-2 md:p-4">
                <div id="spriteLeftContainer" class="sprite-position left hidden">
                    <img id="spriteLeft" class="sprite-image" src="" alt="Левый персонаж" ondragstart="return false;">
                </div>
                <div id="spriteCenterContainer" class="sprite-position center hidden">
                    <img id="spriteCenter" class="sprite-image" src="" alt="Центральный персонаж" ondragstart="return false;">
                </div>
                <div id="spriteRightContainer" class="sprite-position right hidden">
                    <img id="spriteRight" class="sprite-image" src="" alt="Правый персонаж" ondragstart="return false;">
                </div>
            </div>

            <!-- Small Dialogue Wrapper -->
            <div id="dialogueWrapper" class="absolute bottom-2 md:bottom-4 left-1/2 -translate-x-1/2 z-20 transition-all duration-300 opacity-100 hidden">
                <div id="speakerNameContainer" class="text-left mb-0 ml-4 md:ml-8"> 
                    <div id="currentSpeaker" class="speaker-name rounded-t-lg rounded-b-none"></div>
                </div>
                <div id="dialogueContentBox" class="vn-overlay rounded-xl shadow-2xl overflow-hidden flex items-start justify-start text-left"> 
                    <p id="currentText" class="leading-tight transition-opacity duration-300"></p>
                </div>
            </div>

            <!-- Full Dialogue Box -->
            <div id="fullDialogueBox" class="hidden">
                <div id="fullDialogueContent" class="h-full w-full flex flex-col p-4 md:p-8">
                    <p id="fullCurrentText" class="leading-relaxed transition-opacity duration-300"></p>
                </div>
            </div>
            
            <!-- Индикатор загрузки главы -->
            <div id="chapter-load-overlay" class="absolute inset-0 z-40 flex flex-col items-center justify-center transition-opacity duration-300 hidden" style="background-color: rgba(23, 28, 38, 0.9);">
                <div class="w-12 h-12 border-4 border-t-transparent border-cyan-400 rounded-full animate-spin"></div>
                <p id="chapter-load-progress" class="mt-4 text-white font-mono text-lg"></p>
            </div>
        </div>
    </main>
    
    <!-- Предупреждение -->
    <div id="warning-overlay" class="fixed inset-0 z-[100] bg-gray-900/95 flex items-center justify-center p-4 md:p-8 transition-opacity duration-500 opacity-100">
        <div id="warning-card" class="p-8 md:p-12 rounded-3xl shadow-2xl max-w-sm lg:max-w-4xl w-full text-center transform scale-100 transition-transform duration-300 border-2" style="background-color: var(--color-warning-bg); border-color: var(--color-warning-accent); color: var(--color-text-primary);">
            <h1 id="warningTitleText" class="text-4xl md:text-7xl font-extrabold mb-6 select-none tracking-tight" style="color: var(--color-warning-accent);">ПРИМЕЧАНИЕ</h1>
            <p class="text-base md:text-xl mb-3 font-medium leading-relaxed" style="color: var(--color-text-secondary);">Это фанатский архив сюжета Guns Girl Z (Honkai Gakuen 2). Все права принадлежат miHoYo.</p>
            <p class="text-sm md:text-base mb-1 font-medium" style="color: var(--color-text-secondary);">Перевод выполнен Haps.</p>
            <p class="text-sm md:text-base mb-8 font-medium" style="color: var(--color-text-secondary);">Сайт разработан с помощью Gemini.</p>
            <button id="close-warning-button" class="warning-button font-bold py-3 px-8 text-base md:text-lg rounded-full transition duration-200 ease-in-out shadow-xl hover:shadow-2xl focus:outline-none focus:ring-4" style="background-color: var(--color-warning-accent);">Закрыть</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            PATHS: {
                SPRITE_BASE: 'images/sprites/',
                BACKGROUND_BASE: 'images/background/',
                AUDIO_BASE: 'audio/',
                METADATA_FILE: 'story/story_metadata.json', 
                STORY_BASE: 'story/ru/',
            },
            STORAGE: {
                THEME_KEY: 'vn_theme',
                WARNING_KEY: 'vn_warning_dismissed',
                VOLUME_KEY: 'vn_volume',
                MUTE_KEY: 'vn_muted',
                PROGRESS_KEY: 'vn_progress',
            },
            AUDIO: {
                DUCKING_RATIO: 0.3, 
                FADE_OUT_TIME: 100, 
                FADE_IN_TIME: 500,  
                SFX_MULTIPLIER: 2.0, 
            },
            PLACEHOLDERS: {
                DEFAULT_BG_COLOR: '#1f2937',
            }
        };
        
        const spritePath = (fileName) => {
            if (!fileName) return "";
            return `${CONFIG.PATHS.SPRITE_BASE}${encodeURIComponent(fileName)}`;
        };

        const STORY_GROUPS = {
            main: { ru: "Основной сюжет", prefix: "main_" },
            extra: { ru: "Дополнительный сюжет", prefix: "extra_" },
            bosses: { ru: "Боссы", prefix: "boss_" },
            vn: { ru: "Визуальная новелла", prefix: "vn_" },
            romance: { ru: "Лёгкая новелла", prefix: "ln_" }
        };
        
        const MAIN_STORY_ARCS = {
            re: { ru: "Ретроспектр" },
            in: { ru: "Наследие" },
            fm: { ru: "Огненный Мотылёк" },
            nl: { ru: "Новая жизнь" },
            ah: { ru: "Академия Хоукая" }
        };
        
        let currentDialogue = []; 
        let currentDialogueIndex = 0;
        let dialogueIsLoaded = false;
        let currentBackgroundUrl = null; 
        window.storyMetadata = null; 
        let isHistoryVisible = false; 
        let activeBgLayer = 1;
        let isNavigating = false;

        // === Утилиты ===
        
        function loadImage(url) {
            if (preloadedAssets[url]) return preloadedAssets[url];
            const promise = new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error(`Failed to load image: ${url}`)); 
                img.src = url; 
            });
            preloadedAssets[url] = promise;
            return promise;
        }

        async function preloadAudioBuffer(url) {
            if (preloadedAssets[url]) return preloadedAssets[url];
            initAudioContext();
            if (!audioContext) return Promise.reject(new Error("AudioContext not ready"));

            const promise = (async () => {
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                    const arrayBuffer = await response.arrayBuffer();
                    return await audioContext.decodeAudioData(arrayBuffer);
                } catch (e) {
                    delete preloadedAssets[url]; 
                    throw e;
                }
            })();
            preloadedAssets[url] = promise;
            return promise;
        }

        async function preloadAssets(index) {
            if (index < 0 || index >= currentDialogue.length) return Promise.resolve([]);
            const step = currentDialogue[index];
            const loadPromises = [];
            
            if (step.background) loadPromises.push(loadImage(CONFIG.PATHS.BACKGROUND_BASE + encodeURIComponent(step.background)).catch(() => null)); 
            if (step.sprite_left) loadPromises.push(loadImage(spritePath(step.sprite_left)).catch(() => null));
            if (step.sprite_right) loadPromises.push(loadImage(spritePath(step.sprite_right)).catch(() => null));
            if (step.sprite_centre) loadPromises.push(loadImage(spritePath(step.sprite_centre)).catch(() => null));
            
            return Promise.all(loadPromises);
        }

        // === Audio System ===
        
        function initAudioContext() {
            if (audioContext && audioContext.state === 'running') return;
            try {
                if (!audioContext) {
                    window.AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioContext = new AudioContext();
                    
                    sfxGainNode = audioContext.createGain();
                    sfxGainNode.gain.value = isMuted ? 0 : (userVolume * CONFIG.AUDIO.SFX_MULTIPLIER);
                    sfxGainNode.connect(audioContext.destination);

                    bgmGainNode = audioContext.createGain();
                    bgmGainNode.gain.value = isMuted ? 0 : userVolume;
                    bgmGainNode.connect(audioContext.destination);
                }
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            } catch (e) {
                console.error("Web Audio API error:", e);
            }
        }

        function setVolume(level, save = true) {
            const volumeLevel = isMuted ? 0 : parseFloat(level);
            userVolume = parseFloat(level);

            if (sfxGainNode) {
                const sfxVolume = isMuted ? 0 : (userVolume * CONFIG.AUDIO.SFX_MULTIPLIER);
                sfxGainNode.gain.setValueAtTime(sfxVolume, audioContext.currentTime);
            }
            
            if (bgmGainNode) {
                const currentBgmVal = bgmGainNode.gain.value;
                if (Math.abs(currentBgmVal - volumeLevel) < 0.1 || !currentSfxSource) {
                     bgmGainNode.gain.setValueAtTime(volumeLevel, audioContext.currentTime);
                }
            }
            
            elements.volumeSlider.value = userVolume;
            updateVolumeIcon();

            if (save) localStorage.setItem(CONFIG.STORAGE.VOLUME_KEY, userVolume.toString());
        }

        function updateVolumeIcon() {
            const iconPath = elements.volumeIcon.querySelector('path') || document.createElementNS('http://www.w3.org/2000/svg', 'path');
            iconPath.setAttribute('stroke-linecap', 'round');
            iconPath.setAttribute('stroke-linejoin', 'round');
            iconPath.setAttribute('stroke-width', '2');
            iconPath.setAttribute('fill', 'none');
            iconPath.setAttribute('stroke', 'currentColor');

            if (isMuted || userVolume === 0) {
                iconPath.setAttribute('d', ICONS.volumeMuted);
            } else if (userVolume < 0.5) {
                iconPath.setAttribute('d', ICONS.volumeLow);
            } else {
                iconPath.setAttribute('d', ICONS.volumeHigh);
            }
            if (!elements.volumeIcon.contains(iconPath)) {
                elements.volumeIcon.innerHTML = '';
                elements.volumeIcon.appendChild(iconPath);
            }
        }
        
        function toggleMute() {
            isMuted = !isMuted;
            localStorage.setItem(CONFIG.STORAGE.MUTE_KEY, isMuted.toString());
            setVolume(userVolume, false);
            updateVolumeIcon();
        }

        function loadVolume() {
            const savedVolume = localStorage.getItem(CONFIG.STORAGE.VOLUME_KEY);
            const savedMute = localStorage.getItem(CONFIG.STORAGE.MUTE_KEY);
            userVolume = savedVolume ? parseFloat(savedVolume) : 0.5;
            isMuted = savedMute === 'true';
            elements.volumeSlider.value = userVolume;
            setVolume(userVolume, false);
            updateVolumeIcon();
        }

        function fadeAudioNode(gainNode, targetVolume, duration = 500) {
            if (!gainNode || !audioContext) return Promise.resolve();
            const now = audioContext.currentTime;
            return new Promise(resolve => {
                gainNode.gain.cancelScheduledValues(now); 
                gainNode.gain.setValueAtTime(gainNode.gain.value, now);
                gainNode.gain.linearRampToValueAtTime(targetVolume, now + (duration / 1000));
                setTimeout(resolve, duration);
            });
        }

        function stopAllSfx() {
            if (currentSfxSource) {
                try {
                    currentSfxSource.stop(0);
                    currentSfxSource.disconnect();
                } catch (e) {}
                currentSfxSource = null;
            }
        }

        async function handleAudio(audioFile) {
            initAudioContext();
            if (!audioContext || !bgmGainNode) return;

            const newAudioUrl = audioFile ? `${CONFIG.PATHS.AUDIO_BASE}${encodeURIComponent(audioFile)}` : null;
            if (newAudioUrl === currentAudioUrl) return;

            // Fade out
            if (currentBgmSource) {
                await fadeAudioNode(bgmGainNode, 0, 500);
                try { currentBgmSource.stop(0); currentBgmSource.disconnect(); } catch (e) {}
                currentBgmSource = null;
            }
            bgmGainNode.gain.setValueAtTime(0, audioContext.currentTime);

            currentAudioUrl = newAudioUrl;

            // Fade in new track
            if (newAudioUrl) {
                try {
                    const audioBuffer = await preloadAudioBuffer(newAudioUrl);
                    const newSource = audioContext.createBufferSource();
                    newSource.buffer = audioBuffer;
                    newSource.loop = true;
                    newSource.connect(bgmGainNode);
                    newSource.start(0);
                    currentBgmSource = newSource;

                    const targetVol = isMuted ? 0 : userVolume;
                    await fadeAudioNode(bgmGainNode, targetVol, 500);
                } catch (e) {
                    console.warn(`BGM load failed: ${newAudioUrl}`, e);
                    currentAudioUrl = null;
                }
            }
        }
