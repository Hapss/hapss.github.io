<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Архив сюжета Houkai Gakuen 2 (Guns Girl Z) на русском языке." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Архив истории Houkai Gakuen 2</title>
    <link rel="icon" type="image/ico" href="images/favico.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        :root, .dark-theme {
            --color-bg-darkest: #171c26;
            --color-bg-main: #1f2937;
            --color-bg-medium: #374151;
            --color-bg-dialogue: #1f2937;
            --color-accent-primary: #0891b2; 
            --color-accent-secondary: #0e7490; 
            --color-accent-ring: #22d3ee; 
            --color-warning-accent: #d946ef; 
            --color-warning-bg: #1e1b4b; 
            --color-text-primary: #e5e7eb; 
            --color-text-secondary: #d1d5db; 
            --color-text-vn: #e5e7eb;
            --color-speaker-name: #ca7cfe; 
        }

        .light-theme {
            --color-bg-darkest: #D7DDEA;  
            --color-bg-main: #F2F4F8;    
            --color-bg-medium: #E4E8F1;   
            --color-bg-dialogue: #1f2937;
            --color-accent-primary: #2563eb; 
            --color-accent-secondary: #1d4ed8; 
            --color-accent-ring: #60a5fa; 
            --color-warning-accent: #c026d3; 
            --color-warning-bg: #fce7f3; 
            --color-text-primary: #1f2937; 
            --color-text-secondary: #6b7280; 
            --color-text-vn: #e5e7eb;
            --color-speaker-name: #ca7cfe; 
        }

        .top-nav {
            background-color: var(--nav-bg);
            transition: background-color 0.4s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .nav-link {
            color: var(--nav-text);
            background-color: transparent;
            transition: all 0.2s ease;
        }
        
        .nav-link:hover {
            background-color: var(--nav-hover);
            transform: translateY(-1px);
        }

        body, #vnViewer, .sprite-image {
            user-select: none;
            -webkit-user-select: none; 
            -moz-user-select: none;
            -ms-user-select: none;
            -user-drag: none;
            -webkit-user-drag: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg-main); 
            color: var(--color-text-primary);
            transition: background-color 0.3s ease;
            overflow-x: hidden;
        }
        
        .vn-overlay {
            background-color: var(--color-bg-dialogue); 
            opacity: 0.9;
            backdrop-filter: blur(4px);
            color: var(--color-text-vn);
            border: 1px solid var(--color-bg-medium); 
        }
        
        .speaker-name {
            background-color: var(--color-bg-dialogue);
            color: var(--color-speaker-name); 
            padding: 4px 12px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            display: inline-block;
            font-weight: bold;
            font-size: 1rem; 
        }
        @media (min-width: 768px) {
            .speaker-name {
                font-size: 1.25rem;
            }
        }
        
        .load-button { background-color: var(--color-accent-primary); }
        .load-button:hover { background-color: var(--color-accent-secondary); }
        .alert-message { background-color: var(--color-accent-primary); }
        
        .warning-button {
            background-color: var(--color-warning-accent);
            color: var(--color-text-primary);
            transition: background-color 0.2s;
        }
        .warning-button:hover {
            background-color: var(--color-accent-primary); 
        }

        #dialogueWrapper {
            width: 95%;
            max-width: 95%; 
            transition: transform 0.3s ease, bottom 0.3s ease, width 0.3s ease;
            transform-origin: bottom center; 
        }

        @media (min-width: 1024px) {
            #dialogueWrapper {
                width: 900px;
                max-width: 900px;
            }
        }

        @media screen and (min-width: 1024px) {
            #vnViewer:fullscreen #dialogueWrapper,
            #vnViewer:-webkit-full-screen #dialogueWrapper {
                width: 70%;
                transform: translateX(-50%) scale(1.3) translateY(-20px); 
                margin-bottom: 2rem;
            }
        }

        #dialogueContentBox { 
            min-height: 150px; 
            height: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        @media (min-width: 768px) {
            #dialogueContentBox {
                min-height: 200px; 
                padding: 2rem;
            }
        }

        @media (max-width: 768px) and (orientation: portrait) {
            #dialogueWrapper {
                width: 98%;
                bottom: 10px;
            }
            #dialogueContentBox {
                min-height: 28vh;
                max-height: 40vh;
                padding: 1rem 0.8rem;
                overflow-y: auto;
            }
            #currentText {
                font-size: 1.05rem;
                line-height: 1.4;
            }
            #speakerNameContainer {
                margin-left: 0.5rem;
            }
        }

        #currentText {
            font-size: 1.125rem;
        }
        @media (min-width: 768px) {
            #currentText {
                font-size: 1.25rem;
            }
        }
        
        #fullDialogueBox {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            background-color: var(--color-bg-dialogue);
            opacity: 0.95;
            transition: opacity 0.3s ease;
        }
        
        #fullDialogueContent {
            overflow-y: auto;
            padding: 2rem;
            color: var(--color-text-vn);
            scrollbar-width: thin;
            height: 100%;
        }

        @media (max-width: 768px) {
            #fullDialogueContent {
                padding: 1.5rem 1rem;
            }
        }

        #fullDialogueContent::-webkit-scrollbar { width: 8px; }
        #fullDialogueContent::-webkit-scrollbar-track { background: var(--color-bg-darkest); border-radius: 10px; }
        #fullDialogueContent::-webkit-scrollbar-thumb { background: var(--color-accent-primary); border-radius: 10px; border: 2px solid var(--color-bg-darkest); }
        #fullDialogueContent::-webkit-scrollbar-thumb:hover { background: var(--color-accent-secondary); }

        .full-text-sm { font-size: 1.1rem; }
        .full-text-md { font-size: 1.35rem; }
        .full-text-lg { font-size: 1.6rem; }

        @media (max-width: 640px) {
            .full-text-sm { font-size: 1rem; }
            .full-text-md { font-size: 1.15rem; }
            .full-text-lg { font-size: 1.3rem; }
        }

        .align-top-left { 
            justify-content: flex-start;
            align-items: flex-start;
            text-align: left;
        }
        
        .align-center {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .sprite-position {
            position: absolute;
            height: 100%;
            bottom: -30%;
            transition: opacity 0.5s ease, transform 0.5s ease, left 0.5s ease, right 0.5s ease, bottom 0.5s ease; 
            z-index: 10;
            display: flex; 
            justify-content: center;
            align-items: flex-end;
            pointer-events: none;
        }

        .sprite-position.left { 
            left: 0; 
            width: 45%; 
        }
        .sprite-position.right { 
            right: 0; 
            width: 45%; 
        }
        
        .sprite-position.center {
            left: 50%;
            transform: translateX(-50%);
            width: 50%; 
        }
        
        .sprite-image {
            height: 100%; 
            width: auto;
            max-height: 100%; 
            object-fit: contain;
            display: block; 
            transition: opacity 0.3s ease, filter 0.3s ease; 
            opacity: 1; 
            transform: scale(1.4);
            transform-origin: bottom center;
        }

        @media (orientation: landscape) {
            .sprite-image {
                object-fit: contain;
            }
        }

        @media (orientation: portrait) {
            .sprite-position {
                bottom: -15%;
                height: 90%; 
            }
            .sprite-image {
                transform: scale(1.1);
                object-fit: cover;
                object-position: top center;
            }
            .sprite-position.left, .sprite-position.right { 
                width: 55%; 
            }
            .sprite-position.center {
                width: 80%;
            }
        }
        
        .dimmed-sprite {
            filter: brightness(0.3) grayscale(30%) !important; 
            opacity: 1 !important; 
        }
        
        @keyframes shake-anim {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake {
            animation: shake-anim 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        .sprite-position.left.exit-left { transform: translateX(-100%) !important; opacity: 0 !important; }
        .sprite-position.left.exit-right { transform: translateX(200%) !important; opacity: 0 !important; }
        .sprite-position.left.exit-down { transform: translateY(100%) !important; opacity: 0 !important; }

        .sprite-position.right.exit-left { transform: translateX(-200%) !important; opacity: 0 !important; }
        .sprite-position.right.exit-right { transform: translateX(100%) !important; opacity: 0 !important; }
        .sprite-position.right.exit-down { transform: translateY(100%) !important; opacity: 0 !important; }

        .sprite-position.center.exit-left { transform: translate(-50%, 0) translateX(-200%) !important; opacity: 0 !important; }
        .sprite-position.center.exit-right { transform: translate(-50%, 0) translateX(200%) !important; opacity: 0 !important; }
        .sprite-position.center.exit-down { transform: translate(-50%, 100%) !important; opacity: 0 !important; }

        
        .bg-layer {
            transition: opacity 1.0s ease; 
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }

        #historyPanel.open {
            transform: translateX(0); 
        }
        #historyPanel {
            right: 0; 
            left: auto; 
            top: 0;
            transform: translateX(100%); 
            transition: transform 0.3s ease; 
            z-index: 70;
            width: 100%; 
            max-width: 90vw;
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 768px) {
            #historyPanel {
                max-width: 400px;
            }
        }
        
        #historyContent {
            flex-grow: 1; 
            overflow-y: auto; 
            padding-bottom: 2rem; 
        }
        
        #historyContent::-webkit-scrollbar { width: 8px; }
        #historyContent::-webkit-scrollbar-track { background: var(--color-bg-medium); border-radius: 10px; }
        #historyContent::-webkit-scrollbar-thumb { background: var(--color-accent-primary); border-radius: 10px; border: 2px solid var(--color-bg-darkest); }
        #historyContent::-webkit-scrollbar-thumb:hover { background: var(--color-accent-secondary); }

        #volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 5px;
            background: var(--color-bg-medium);
            border-radius: 5px;
            outline: none;
            transition: opacity 0.2s;
        }
        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--color-accent-ring);
            cursor: pointer;
            border-radius: 50%;
        }
         #volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--color-accent-ring);
            cursor: pointer;
            border-radius: 50%;
        }

        #vnViewer:fullscreen {
            width: 100vw;
            height: 100vh;
            border-radius: 0; 
            aspect-ratio: auto; 
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            background-color: black;
        }
        
        #vnViewer:-webkit-full-screen {
            width: 100%;
            height: 100%;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .tooltip-text {
            visibility: hidden;
            background-color: var(--color-bg-medium);
            color: var(--color-text-primary);
            text-align: center;
            border-radius: 6px;
            padding: 5px 10px;
            position: absolute;
            z-index: 60;
            top: 100%; 
            right: 0;
            margin-top: 5px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.75rem;
            white-space: nowrap;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            pointer-events: none;
        }

        .tooltip-container:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }

        #endStoryOverlay {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
        }
        
        .warning-title {
            font-size: 2.25rem;
        }
        @media (min-width: 768px) {
            .warning-title { font-size: 4.5rem; }
        }
        @media (max-width: 400px) {
            .warning-title { font-size: 1.8rem; }
        }

        #choicesContainer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 45;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 80%;
            max-width: 600px;
            pointer-events: auto;
        }
        .choice-button {
            background-color: var(--color-bg-dialogue);
            color: var(--color-text-vn);
            padding: 12px 20px;
            border-radius: 8px;
            border: 2px solid var(--color-accent-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-weight: bold;
            font-size: 1.125rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .choice-button:hover {
            background-color: var(--color-accent-primary);
            color: white;
            transform: translateY(-2px);
        }

    </style>
</head>
<body class="min-h-screen dark-theme">
    
    <header id="header" class="fixed top-0 left-0 right-0 z-50 p-3 md:p-4 shadow-xl transition-colors duration-300" style="background-color: var(--color-bg-darkest);">
        <div class="flex flex-wrap justify-between items-center max-w-7xl mx-auto">
            <div class="flex items-center space-x-3">
                <nav class="top-nav p-3 flex flex-wrap justify-between items-center gap-4 sticky top-0 z-50">
            <a href="index.html" class="nav-link px-3 py-2 rounded-lg text-sm font-bold">Главная</a>
            <a href="vn.html" class="nav-link px-3 py-2 rounded-lg text-sm font-bold ring-2 ring-white/20">История</a>
            <a href="partners.html" class="nav-link px-3 py-2 rounded-lg text-sm font-bold">Узы</a>
            <a href="chara.html" class="nav-link px-3 py-2 rounded-lg text-sm font-bold">Персонажи</a>
            <a href="wonderland.html" class="nav-link px-3 py-2 rounded-lg text-sm font-bold">Страна чудес</a>
            </nav>
            </div>
            
            <div class="flex items-center space-x-2 md:space-x-4">
                <button id="historyToggle" onclick="toggleHistory()" class="px-2 py-1 text-xs md:text-sm rounded-full transition duration-150" style="background-color: var(--color-bg-medium); color: var(--color-text-primary);">
                    <span id="historyText">История</span>
                </button>
                
                <button id="themeToggle" onclick="toggleTheme()" class="px-2 py-1 text-xs md:text-sm rounded-full transition duration-150" style="background-color: var(--color-bg-medium); color: var(--color-text-primary);">
                    <span id="themeIcon">🌙</span> <span id="themeText">Тёмная</span>
                </button>

                <div id="volume-control-container" class="flex items-center space-x-2" style="background-color: var(--color-bg-medium); padding: 4px 8px; border-radius: 9999px;">
                    <button id="mute-button" onclick="toggleMute()" class="p-1 rounded-full transition-colors duration-150 hover:bg-[var(--color-bg-main)]">
                        <svg id="volume-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"></svg>
                    </button>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
                </div>
            </div>
        </div>
    </header>
    
    <div id="historyPanel" class="fixed top-0 h-full p-4 pt-20 shadow-2xl transition-transform duration-300" 
         style="background-color: var(--color-bg-darkest); opacity: 0.95;">
        <h2 id="historyTitle" class="text-xl font-bold mb-4" style="color: var(--color-text-primary);">Лог главы</h2>
        <div id="historyContent" class="space-y-3" style="height: calc(100% - 3.5rem);"></div>
        <button onclick="toggleHistory()" class="absolute top-4 right-4 text-xl p-2 rounded-full hover:bg-gray-700 transition" style="color: var(--color-text-primary);">
            &times;
        </button>
    </div>

    <main id="mainContent" class="pt-[6rem] md:pt-20 pb-4 px-2 md:px-4 max-w-7xl mx-auto min-h-screen">
        
        <div class="control-panel p-4 rounded-xl shadow-lg mb-6 flex flex-wrap gap-3 md:gap-4 items-end transition-colors duration-300" style="background-color: var(--color-bg-medium);">
            <div class="flex-1 min-w-[45%] md:min-w-[180px]">
                <label for="storyTypeSelect" id="labelStoryType" class="block text-sm font-medium mb-1" style="color: var(--color-text-secondary);">Тип сюжета</label>
                <select id="storyTypeSelect" onchange="updateArcAndChapterUI()" class="select-field w-full rounded-lg p-2.5 cursor-pointer focus:ring-4 transition text-sm" style="background-color: var(--color-bg-main);"></select>
            </div>

            <div id="arcSelectContainer" class="flex-1 min-w-[45%] md:min-w-[180px] hidden">
                <label for="arcSelect" id="labelArc" class="block text-sm font-medium mb-1" style="color: var(--color-text-secondary);">Арка</label>
                <select id="arcSelect" onchange="updateChapterSelect()" class="select-field w-full rounded-lg p-2.5 cursor-pointer focus:ring-4 transition text-sm" style="background-color: var(--color-bg-main);"></select>
            </div>

            <div class="w-full md:flex-1 md:min-w-[250px]">
                <label for="chapterSelect" id="labelChapter" class="block text-sm font-medium mb-1" style="color: var(--color-text-secondary);">Глава</label>
                <select id="chapterSelect" onchange="enableLoadButton()" class="select-field w-full rounded-lg p-2.5 cursor-pointer focus:ring-4 transition text-sm" disabled style="background-color: var(--color-bg-main);"></select>
            </div>
            
            <button id="loadButton" onclick="updateStoryContent()" class="w-full md:w-auto min-w-[120px] load-button text-white font-bold py-2.5 px-4 rounded-lg shadow-md transition duration-150 disabled:opacity-50 text-sm md:text-base" disabled>
                <span id="loadText">Загрузить</span>
            </button>
        </div>

        <div id="vnViewer" class="relative w-full aspect-[16/9] rounded-xl shadow-2xl overflow-hidden flex flex-col justify-end transition-colors duration-500 cursor-pointer" 
             style="min-height: 400px; background-color: var(--color-bg-main);"
             onclick="navigateDialogue(1)"> 
            
            <button id="fullscreenToggle" onclick="toggleFullscreen(event)" class="tooltip-container absolute top-4 right-4 z-50 p-2 rounded-full transition-colors duration-150 hover:bg-black/50 bg-black/30 text-white backdrop-blur-sm group">
                <svg id="icon-enter-fullscreen" class="w-6 h-6 block" fill="currentColor" viewBox="0 0 24 24">
                   <path d="M4 8V4H8 M4 4L9 9 M16 4H20V8 M20 4L15 9 M20 16V20H16 M20 20L15 15 M8 20H4V16 M4 20L9 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <svg id="icon-exit-fullscreen" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
                <span id="fullscreen-tooltip-text" class="tooltip-text">Полноэкранный режим</span>
            </button>

            <div id="backgroundContainer" class="absolute inset-0 z-0">
                <div id="bgLayer1" class="absolute inset-0 bg-layer opacity-100"></div>
                <div id="bgLayer2" class="absolute inset-0 bg-layer opacity-0"></div>
            </div>
            
            <video id="bgVideo" class="absolute inset-0 w-full h-full object-cover z-30 hidden pointer-events-none" playsinline></video>

            <div id="spriteContainer" class="absolute inset-0 z-10 pointer-events-none flex justify-center items-end p-2 md:p-4">
                <div id="spriteLeftContainer" class="sprite-position left hidden">
                    <img id="spriteLeft" class="sprite-image" src="" alt="Левый персонаж" ondragstart="return false;">
                </div>
                <div id="spriteCenterContainer" class="sprite-position center hidden">
                    <img id="spriteCenter" class="sprite-image" src="" alt="Центральный персонаж" ondragstart="return false;">
                </div>
                <div id="spriteRightContainer" class="sprite-position right hidden">
                    <img id="spriteRight" class="sprite-image" src="" alt="Правый персонаж" ondragstart="return false;">
                </div>
            </div>

            <div id="dialogueWrapper" class="absolute bottom-2 md:bottom-4 left-1/2 -translate-x-1/2 z-40 transition-all duration-300 opacity-100 hidden">
                <div id="speakerNameContainer" class="text-left mb-0 ml-4 md:ml-8"> 
                    <div id="currentSpeaker" class="speaker-name rounded-t-lg rounded-b-none"></div>
                </div>
                <div id="dialogueContentBox" class="vn-overlay rounded-xl shadow-2xl overflow-hidden flex items-start justify-start text-left"> 
                    <p id="currentText" class="leading-tight transition-opacity duration-300"></p>
                </div>
            </div>

            <div id="fullDialogueBox" class="hidden z-40">
                <div id="fullDialogueContent" class="h-full w-full flex flex-col p-4 md:p-8">
                    <p id="fullCurrentText" class="leading-relaxed transition-opacity duration-300"></p>
                </div>
            </div>

            <div id="choicesContainer" class="hidden"></div>

            <div id="chapter-load-overlay" class="absolute inset-0 z-50 flex flex-col items-center justify-center transition-opacity duration-300 hidden" style="background-color: rgba(23, 28, 38, 0.9);">
                <div class="w-12 h-12 border-4 border-t-transparent border-cyan-400 rounded-full animate-spin"></div>
                <p id="chapter-load-progress" class="mt-4 text-white font-mono text-lg"></p>
            </div>

            <div id="endStoryOverlay" class="absolute inset-0 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-500">
                <div class="text-center p-8 rounded-2xl border border-gray-600 bg-gray-900/90 shadow-2xl transform scale-110">
                    <h3 class="text-2xl md:text-3xl font-bold text-cyan-400 mb-2">Глава завершена</h3>
                    <p class="text-gray-300 text-lg">Вы достигли конца.</p>
                </div>
            </div>

        </div>
    </main>
<script>
        const CONFIG = {
            PATHS: {
                SPRITE_BASE: 'images/sprites/',
                BACKGROUND_BASE: 'images/background/',
                AUDIO_BASE: 'audio/',
                VIDEO_BASE: 'videos/', 
                METADATA_FILE: 'story/story_metadata.json', 
                STORY_BASE: 'story/ru/',

        function loadImage(url) {
            const resolvedUrl = resolvePath(url);
            if (preloadedAssets[resolvedUrl]) return preloadedAssets[resolvedUrl];
            const promise = new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error(`Failed to load image: ${resolvedUrl}`)); 
                img.src = resolvedUrl; 
            });
            preloadedAssets[resolvedUrl] = promise;
            return promise;
        }

        async function preloadAudioBuffer(url) {
            const resolvedUrl = resolvePath(url);
            if (preloadedAssets[resolvedUrl]) return preloadedAssets[resolvedUrl];
            initAudioContext();
            if (!audioContext) return Promise.reject(new Error("AudioContext not ready"));

            const promise = (async () => {
                try {
                    const response = await fetch(resolvedUrl);
                    if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                    const arrayBuffer = await response.arrayBuffer();
                    return await audioContext.decodeAudioData(arrayBuffer);
                } catch (e) {
                    delete preloadedAssets[resolvedUrl]; 
                    throw e;
                }
            })();
            preloadedAssets[resolvedUrl] = promise;
            return promise;
        }

        async function preloadAssets(index) {
            if (index < 0 || index >= currentDialogue.length) return Promise.resolve([]);
            const step = currentDialogue[index];
            const loadPromises = [];
            
            if (step.background) loadPromises.push(loadImage(CONFIG.PATHS.BACKGROUND_BASE + encodeURIComponent(step.background)).catch(() => null)); 
            if (step.sprite_left) loadPromises.push(loadImage(spritePath(step.sprite_left)).catch(() => null));
            if (step.sprite_right) loadPromises.push(loadImage(spritePath(step.sprite_right)).catch(() => null));
            if (step.sprite_centre) loadPromises.push(loadImage(spritePath(step.sprite_centre)).catch(() => null));
            
            return Promise.all(loadPromises);
        }

        
        function initAudioContext() {
            if (audioContext && audioContext.state === 'running') return;
            try {
                if (!audioContext) {
                    window.AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioContext = new AudioContext();
                    
                    sfxGainNode = audioContext.createGain();
                    sfxGainNode.gain.value = isMuted ? 0 : (userVolume * CONFIG.AUDIO.SFX_MULTIPLIER);
                    sfxGainNode.connect(audioContext.destination);

                    bgmGainNode = audioContext.createGain();
                    bgmGainNode.gain.value = isMuted ? 0 : userVolume;
                    bgmGainNode.connect(audioContext.destination);
                }
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            } catch (e) {
                console.error("Web Audio API error:", e);
            }
        }

        function setVolume(level, save = true) {
            const volumeLevel = isMuted ? 0 : parseFloat(level);

            if (sfxGainNode) {
                const sfxVolume = isMuted ? 0 : (userVolume * CONFIG.AUDIO.SFX_MULTIPLIER);

            }
            
            if (bgmGainNode) {
                const currentBgmVal = bgmGainNode.gain.value;
                if (Math.abs(currentBgmVal - volumeLevel) < 0.1 || !currentSfxSource) {
                     bgmGainNode.gain.setValueAtTime(volumeLevel, audioContext.currentTime);
                }

            if (elements.bgVideo) {
                elements.bgVideo.volume = volumeLevel;

            iconPath.setAttribute('stroke-linecap', 'round');
            iconPath.setAttribute('stroke-linejoin', 'round');
            iconPath.setAttribute('stroke-width', '2');
            iconPath.setAttribute('fill', 'none');
            iconPath.setAttribute('stroke', 'currentColor');

            if (isMuted || userVolume === 0) {
                iconPath.setAttribute('d', ICONS.volumeMuted);

        function loadVolume() {

        function fadeAudioNode(gainNode, targetVolume, duration = 500) {
            if (!gainNode || !audioContext) return Promise.resolve();
            const now = audioContext.currentTime;
            return new Promise(resolve => {
                gainNode.gain.cancelScheduledValues(now); 
                gainNode.gain.setValueAtTime(gainNode.gain.value, now);
                gainNode.gain.linearRampToValueAtTime(targetVolume, now + (duration / 1000));
                setTimeout(resolve, duration);
            });
        }

        function stopAllSfx() {
            if (currentSfxSource) {
                try {
                    currentSfxSource.stop(0);
                    currentSfxSource.disconnect();
                } catch (e) {}
                currentSfxSource = null;
            }
        }

        async function handleAudio(audioFile) {
            initAudioContext();
            if (!audioContext || !bgmGainNode) return;

            const newAudioUrl = audioFile ? resolvePath(`${CONFIG.PATHS.AUDIO_BASE}${encodeURIComponent(audioFile)}`) : null;
            if (newAudioUrl === currentAudioUrl) return;

            if (currentBgmSource) {
                await fadeAudioNode(bgmGainNode, 0, 500);
                try { currentBgmSource.stop(0); currentBgmSource.disconnect(); } catch (e) {}
                currentBgmSource = null;
            }
            bgmGainNode.gain.setValueAtTime(0, audioContext.currentTime);

            currentAudioUrl = newAudioUrl;

            if (newAudioUrl) {
                try {
                    const audioBuffer = await preloadAudioBuffer(newAudioUrl);
                    const newSource = audioContext.createBufferSource();
                    newSource.buffer = audioBuffer;
                    newSource.loop = true;
                    newSource.connect(bgmGainNode);
                    newSource.start(0);
                    currentBgmSource = newSource;

                    const targetVol = isMuted ? 0 : userVolume;
                    await fadeAudioNode(bgmGainNode, targetVol, 500);
                } catch (e) {
                    console.warn(`BGM load failed: ${newAudioUrl}`, e);
                    currentAudioUrl = null;
                }
            }
        }
        
        function handleSfx(sfxFile, dialogueIndex) {
            if (!sfxFile) return;
            initAudioContext();
            if (!audioContext || !sfxGainNode) return;

            const sfxUrl = resolvePath(`${CONFIG.PATHS.AUDIO_BASE}${encodeURIComponent(sfxFile)}`);

            preloadAudioBuffer(sfxUrl).then(audioBuffer => {
                if (dialogueIndex !== currentDialogueIndex) return; 
                if (!audioBuffer) return;

                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.loop = false;
                source.connect(sfxGainNode); 
                
                stopAllSfx();

                if (bgmGainNode && !isMuted) {
                    const duckVolume = userVolume * CONFIG.AUDIO.DUCKING_RATIO;
                    fadeAudioNode(bgmGainNode, duckVolume, CONFIG.AUDIO.FADE_OUT_TIME);
                }
                
                const sfxVol = isMuted ? 0 : (userVolume * CONFIG.AUDIO.SFX_MULTIPLIER);
                sfxGainNode.gain.cancelScheduledValues(audioContext.currentTime);
                sfxGainNode.gain.setValueAtTime(sfxVol, audioContext.currentTime);

                source.start(0); 
                currentSfxSource = source;
                
                source.onended = () => {
                    if (currentSfxSource === source) {
                        currentSfxSource = null;
                        if (bgmGainNode && !isMuted) {
                            fadeAudioNode(bgmGainNode, userVolume, CONFIG.AUDIO.FADE_IN_TIME);
                        }
                    }
                };
            }).catch(e => console.error(`SFX failed: ${sfxUrl}`, e));
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        async function restoreProgress() {
            const savedData = localStorage.getItem(CONFIG.STORAGE.PROGRESS_KEY);
            
            updateI18nStrings(); 

            if (!savedData) {
                initializeOrUpdateUI(); 
                return;
            }

            try {
                const progress = JSON.parse(savedData);
                console.log("[Restore] Found saved state:", progress);

                const typeOption = elements.storyTypeSelect.querySelector(`option[value="${progress.type}"]`);
                if (!typeOption) throw new Error(`Saved Type "${progress.type}" not found (config changed?).`);
                
                elements.storyTypeSelect.value = progress.type;
                updateArcAndChapterUI(); 

                if (progress.type === 'main' && progress.arc) {
                    const arcOption = elements.arcSelect.querySelector(`option[value="${progress.arc}"]`);
                    if (arcOption) {
                        elements.arcSelect.value = progress.arc;
                    } else {
                        console.warn(`Saved Arc "${progress.arc}" not found in list.`);
                    }
                }

                updateChapterSelect();

                const chapterOption = elements.chapterSelect.querySelector(`option[value="${progress.chapter}"]`);
                if (chapterOption) {
                    elements.chapterSelect.value = progress.chapter;
                    enableLoadButton();

                    if (progress.activeFlags) {
                        activeFlags = new Set(progress.activeFlags); 
                    }
                    
                    console.log(`[Restore] Loading chapter ${progress.chapter} at index ${progress.index}`);
                    await updateStoryContent(progress.index, progress.scrollTop);
                } else {
                    throw new Error(`Saved Chapter "${progress.chapter}" not found in list.`);
                }

            } catch (e) {
                console.warn("[Restore] Failed or Save invalid:", e);
                localStorage.removeItem(CONFIG.STORAGE.PROGRESS_KEY); 
                initializeOrUpdateUI();
            }
        }

        function populateStoryTypes() {
            const typeSelect = elements.storyTypeSelect;
            if (!typeSelect) return;
            const currentVal = typeSelect.value;
            typeSelect.innerHTML = '';
            for (const key in STORY_GROUPS) {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = STORY_GROUPS[key].ru;
                if (key === currentVal) option.selected = true;
                typeSelect.appendChild(option);
            }
        }

        
        function processTextForBreaks(text) {
            if (text == null) return '';
            return String(text).replace(/\n/g, '<br>');
        }

        function parseColoredText(text) {
            if (text == null) return '';
            return String(text).replace(/\[color=([^\]]+)\](.*?)\[\/color\]/gi, (match, color, innerText) => {
                const safeColor = color.replace(/['"<>]/g, ''); 
                return `<span style="color: ${safeColor};">${innerText}</span>`;
            });
        }

        function loadSprite(url, imgElement, containerElement) {
            if (!url) {
                containerElement.classList.add('hidden');
                return;
            }
            const resolvedUrl = resolvePath(url);
            
            const needsReload = imgElement.src !== resolvedUrl;
            if (needsReload) imgElement.src = resolvedUrl;
            
            imgElement.onload = () => containerElement.classList.remove('hidden');
            imgElement.onerror = () => containerElement.classList.add('hidden');
            if (imgElement.complete && needsReload) containerElement.classList.remove('hidden');
            else if (!needsReload) containerElement.classList.remove('hidden');
        }

        function crossFadeBackground(newBackgroundFile) {
            const { bgLayer1, bgLayer2 } = elements;
            const themeBgColor = getComputedStyle(document.body).getPropertyValue('--color-bg-main').trim();
            
            let newBgUrl = CONFIG.PLACEHOLDERS.DEFAULT_BG_COLOR;
            let isImage = false;

            if (newBackgroundFile) {
                newBgUrl = resolvePath(CONFIG.PATHS.BACKGROUND_BASE + encodeURIComponent(newBackgroundFile));
                isImage = true;
            }
            
            if (newBgUrl === currentBackgroundUrl) return;
            currentBackgroundUrl = newBgUrl;

            const activeLayer = (activeBgLayer === 1) ? bgLayer1 : bgLayer2;
            const inactiveLayer = (activeBgLayer === 1) ? bgLayer2 : bgLayer1;

            if (isImage) {
                inactiveLayer.style.backgroundImage = `url("${newBgUrl}")`;
                inactiveLayer.style.backgroundColor = 'transparent';
            } else {
                inactiveLayer.style.backgroundImage = 'none';
                inactiveLayer.style.backgroundColor = themeBgColor;
            }

            activeLayer.style.opacity = '0';
            inactiveLayer.style.opacity = '1';
            activeBgLayer = (activeBgLayer === 1) ? 2 : 1;
        }
        
        async function fetchChapterMetadata() {
            try {
                const safePath = resolvePath(CONFIG.PATHS.METADATA_FILE);
                const response = await fetch(safePath); 
                
                if (!response.ok) throw new Error(response.statusText);
                window.storyMetadata = await response.json();
                
                updateArcAndChapterUI(); 
            } catch (error) {
                console.error("Metadata load error:", error);
                
                if (window.location.protocol === 'file:') {
                     alertMessage("Ошибка: Запуск через file:// не поддерживается современными браузерами. Пожалуйста, используйте локальный сервер (например, VS Code Live Server).");
                } else {
                     alertMessage(i18n.ru.errorFetchMetadataStrict); 
                }
            }
        }

        function navigateDialogue(direction) {
            if (isHistoryVisible || isNavigating || isAwaitingChoice) return;
            isNavigating = true; 
            initAudioContext();
            stopAllSfx(); 
            
            try { 
                if (!dialogueIsLoaded || currentDialogue.length === 0) return;
                
                let newIndex = currentDialogueIndex + direction;

                while (newIndex >= 0 && newIndex < currentDialogue.length) {
                    const checkStep = currentDialogue[newIndex];
                    if (checkStep.requires && !activeFlags.has(checkStep.requires)) {
                        newIndex += direction;
                    } else {
                        break;
                    }
                }

                if (newIndex >= 0 && newIndex < currentDialogue.length) {
                    currentDialogueIndex = newIndex;
                    renderDialogueStep();
                    
                    if (direction > 0) {
                        let nextValidIndex = currentDialogueIndex + 1;
                        while(nextValidIndex < currentDialogue.length && currentDialogue[nextValidIndex].requires && !activeFlags.has(currentDialogue[nextValidIndex].requires)) {
                            nextValidIndex++;
                        }
                        preloadAssets(nextValidIndex);
                    }
                } else if (newIndex >= currentDialogue.length) {
                    showEndStoryOverlay();
                    currentDialogueIndex = currentDialogue.length - 1;
                    handleAudio(null); 
                } else {
                    alertMessage(i18n.ru.startOfStory);
                }
            } catch (e) {
                 console.error(e);
                 alertMessage(i18n.ru.errorRender(e.message));
            } finally {
                isNavigating = false; 
            }
        }

        function showEndStoryOverlay() {
            elements.endStoryOverlay.classList.remove('hidden');
            void elements.endStoryOverlay.offsetWidth;
            elements.endStoryOverlay.classList.remove('opacity-0');
            
            const hide = () => {
                 elements.endStoryOverlay.classList.add('opacity-0');
                 setTimeout(() => {
                     elements.endStoryOverlay.classList.add('hidden');
                 }, 500);
            };
            
            setTimeout(hide, 3000);
            elements.endStoryOverlay.onclick = hide;
        }
        
        function renderDialogueStep() {
            const step = currentDialogue[currentDialogueIndex];
            const isFullText = step.text_style === 'full';
            const isVideo = !!step.video;
            
            saveProgress();

            if ('audio' in step) {
                handleAudio(step.audio);
            }

            if (step.sfx) {
                handleSfx(step.sfx, currentDialogueIndex);
            } else {
                if (bgmGainNode && !isMuted) {
                     fadeAudioNode(bgmGainNode, userVolume, 300);
                }
            }

            elements.dialogueWrapper.classList.toggle('hidden', isFullText || isVideo);
            elements.fullDialogueBox.classList.toggle('hidden', !isFullText || isVideo);
            
            if (isVideo) {
                elements.bgVideo.src = resolvePath(`${CONFIG.PATHS.VIDEO_BASE}${encodeURIComponent(step.video)}`);
                elements.bgVideo.volume = isMuted ? 0 : userVolume;
                elements.bgVideo.classList.remove('hidden');
                elements.bgVideo.play().catch(e => console.error("Ошибка воспроизведения видео:", e));
                elements.bgVideo.onended = () => {
                    navigateDialogue(1);
                };
            } else {
                elements.bgVideo.pause();
                elements.bgVideo.src = '';
                elements.bgVideo.classList.add('hidden');
                elements.bgVideo.onended = null;
            }

            if ('background' in step) crossFadeBackground(step.background); 

            const { spriteLeftElement, spriteRightElement, spriteCenterElement, 
                    spriteLeftContainer, spriteRightContainer, spriteCenterContainer,
                    vnViewerElement } = elements;

            spriteLeftElement.classList.remove('dimmed-sprite');
            spriteRightElement.classList.remove('dimmed-sprite');
            spriteCenterElement.classList.remove('dimmed-sprite');

            const newLeft = step.sprite_left || null;
            const newRight = step.sprite_right || null;
            const newCenter = step.sprite_centre || null;

            spriteLeftContainer.style.cssText = '';
            spriteRightContainer.style.cssText = '';
            spriteCenterContainer.style.cssText = '';

            const exitClasses = ['exit-left', 'exit-right', 'exit-down'];
            spriteLeftContainer.classList.remove(...exitClasses);
            spriteRightContainer.classList.remove(...exitClasses);
            spriteCenterContainer.classList.remove(...exitClasses);

            if (step.pos_left) spriteLeftContainer.style.cssText = step.pos_left;
            if (step.pos_right) spriteRightContainer.style.cssText = step.pos_right;
            if (step.pos_center) spriteCenterContainer.style.cssText = step.pos_center;

            if (step.anim_left) spriteLeftContainer.classList.add(step.anim_left);
            if (step.anim_right) spriteRightContainer.classList.add(step.anim_right);
            if (step.anim_center) spriteCenterContainer.classList.add(step.anim_center);

            vnViewerElement.classList.remove('shake');
            if (step.effect === 'shake') {
                void vnViewerElement.offsetWidth; 
                vnViewerElement.classList.add('shake');
            }

            if (newCenter) {
                loadSprite(spritePath(newCenter), spriteCenterElement, spriteCenterContainer);
                spriteLeftContainer.classList.add('hidden');
                spriteRightContainer.classList.add('hidden');
            } else {
                spriteCenterContainer.classList.add('hidden');
                if (newLeft) loadSprite(spritePath(newLeft), spriteLeftElement, spriteLeftContainer);
                else spriteLeftContainer.classList.add('hidden');
                
                if (newRight) loadSprite(spritePath(newRight), spriteRightElement, spriteRightContainer);
                else spriteRightContainer.classList.add('hidden');
            }
            
            let dimTargets = new Set();
            const speakerPos = step.position ? step.position.toLowerCase() : null;
            
            if (step.dim_override && !isFullText && !isVideo) { 
                const overrideValue = step.dim_override.toLowerCase().replace(/\s/g, '');
                if (overrideValue === 'auto' && step.speaker && speakerPos) {
                    if (speakerPos === 'left') dimTargets.add('center').add('right');
                    else if (speakerPos === 'right') dimTargets.add('center').add('left');
                    else if (speakerPos === 'center') dimTargets.add('left').add('right');
                } else if (overrideValue === 'all') {
                    dimTargets.add('left').add('center').add('right');
                } else if (overrideValue === 'both') {
                    dimTargets.add('left').add('right');
                } else if (overrideValue !== 'none') {
                    overrideValue.split(',').forEach(pos => { if (['left','center','right'].includes(pos)) dimTargets.add(pos); });
                }
            }

            if (!isFullText && !isVideo) {
                if (dimTargets.has('left')) spriteLeftElement.classList.add('dimmed-sprite');
                if (dimTargets.has('center')) spriteCenterElement.classList.add('dimmed-sprite');
                if (dimTargets.has('right')) spriteRightElement.classList.add('dimmed-sprite');
            }

            if (isFullText) {
                elements.fullCurrentText.innerHTML = parseColoredText(processTextForBreaks(step.text));
                elements.fullCurrentText.className = `leading-relaxed transition-opacity duration-300 full-text-${step.full_text_size || 'md'}`;
                elements.fullDialogueContent.classList.remove('align-top-left', 'align-center');
                elements.fullDialogueContent.classList.add((step.full_text_align || 'top-left') === 'center' ? 'align-center' : 'align-top-left');
                elements.speakerNameContainer.classList.add('hidden');
            } else if (!isVideo) {
                elements.currentSpeaker.textContent = step.speaker || "";
                elements.speakerNameContainer.classList.toggle('hidden', !step.speaker);
                elements.currentText.innerHTML = parseColoredText(processTextForBreaks(step.text));
            }

            elements.choicesContainer.classList.add('hidden');
            elements.choicesContainer.innerHTML = '';
            isAwaitingChoice = false;

            if (step.choices && Array.isArray(step.choices) && step.choices.length > 0) {
                isAwaitingChoice = true;
                elements.choicesContainer.classList.remove('hidden');
                
                step.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-button';
                    btn.textContent = choice.text;
                    btn.onclick = (e) => {
                        e.stopPropagation(); 
                        if (choice.flag) activeFlags.add(choice.flag);
                        isAwaitingChoice = false;
                        elements.choicesContainer.classList.add('hidden');
                        navigateDialogue(1);
                    };
                    elements.choicesContainer.appendChild(btn);
                });
            }
            
            if (isHistoryVisible) renderHistory();
        }
        
        async function updateStoryContent(startIndex = 0, startScrollTop = 0) {
            const fullStoryKey = elements.chapterSelect.value.trim();
            if (!fullStoryKey) return;

            initAudioContext();
            await handleAudio(null);
            stopAllSfx();

            elements.loadButton.disabled = true;
            elements.loadText.textContent = i18n.ru.loadingText;
            elements.chapterLoadOverlay.classList.remove('hidden');
            elements.chapterLoadProgress.textContent = `(0/?)`;

            const expectedFilePath = resolvePath(`${CONFIG.PATHS.STORY_BASE}${fullStoryKey}.json`);
            let chapterData;
            try {
                const response = await fetch(expectedFilePath);
                if (!response.ok) throw new Error(response.statusText);
                chapterData = await response.json();
                if (!chapterData || !Array.isArray(chapterData.dialogue)) throw new Error("Invalid JSON format");
            } catch (error) {
                console.error(error);
                alertMessage(i18n.ru.errorChapterNotFound);
                elements.loadText.textContent = i18n.ru.loadText;
                elements.loadButton.disabled = false;
                elements.chapterLoadOverlay.classList.add('hidden');
                return;
            }

            const urlsToLoad = new Set();
            for (const step of chapterData.dialogue) {
                if (step.background) urlsToLoad.add(CONFIG.PATHS.BACKGROUND_BASE + encodeURIComponent(step.background));
                if (step.sprite_left) urlsToLoad.add(spritePath(step.sprite_left));
                if (step.sprite_right) urlsToLoad.add(spritePath(step.sprite_right));
                if (step.sprite_centre) urlsToLoad.add(spritePath(step.sprite_centre));
            }
            const loadList = Array.from(urlsToLoad);
            
            elements.chapterLoadProgress.textContent = `(0/${loadList.length})`;
            if (loadList.length > 0) {
                const BATCH = 10;
                let loaded = 0;
                for (let i = 0; i < loadList.length; i += BATCH) {
                    await Promise.allSettled(loadList.slice(i, i + BATCH).map(url => loadImage(url).catch(()=>{})));
                    loaded += Math.min(BATCH, loadList.length - i);
                    elements.chapterLoadProgress.textContent = `(${loaded}/${loadList.length})`;
                }
            }
            
            const sfxUrls = new Set();
            chapterData.dialogue.forEach(s => s.sfx && sfxUrls.add(CONFIG.PATHS.AUDIO_BASE + encodeURIComponent(s.sfx)));
            if (sfxUrls.size > 0) {
                Promise.allSettled(Array.from(sfxUrls).map(url => preloadAudioBuffer(url).catch(()=>{})));
            }

            currentDialogue = chapterData.dialogue;
            currentDialogueIndex = (startIndex >= 0 && startIndex < currentDialogue.length) ? startIndex : 0;
            dialogueIsLoaded = true;
            
            activeFlags.clear();
            isAwaitingChoice = false;

            currentBackgroundUrl = null;
            elements.spriteLeftContainer.classList.add('hidden');
            elements.spriteRightContainer.classList.add('hidden');
            elements.spriteCenterContainer.classList.add('hidden'); 
            elements.spriteLeftElement.src = ''; elements.spriteRightElement.src = ''; elements.spriteCenterElement.src = ''; 
            elements.fullDialogueBox.classList.add('hidden'); 
            elements.choicesContainer.classList.add('hidden');
            elements.choicesContainer.innerHTML = '';
            
            elements.bgVideo.pause();
            elements.bgVideo.src = '';
            elements.bgVideo.classList.add('hidden');
            elements.bgVideo.onended = null;

            const themeBgColor = getComputedStyle(document.body).getPropertyValue('--color-bg-main').trim();
            elements.bgLayer1.style.backgroundImage = 'none'; elements.bgLayer1.style.backgroundColor = themeBgColor; elements.bgLayer1.style.opacity = '1';
            elements.bgLayer2.style.opacity = '0'; elements.bgLayer2.style.backgroundImage = 'none';
            activeBgLayer = 1;
            currentBackgroundUrl = CONFIG.PLACEHOLDERS.DEFAULT_BG_COLOR;

            let restoredBg = null;
            let restoredAudio = undefined; 

            for (let i = 0; i <= currentDialogueIndex; i++) {
                const step = currentDialogue[i];
                if ('background' in step) restoredBg = step.background;
                if ('audio' in step) restoredAudio = step.audio;
            }

            if (restoredBg !== null) crossFadeBackground(restoredBg); 
            if (restoredAudio !== undefined) await handleAudio(restoredAudio); 

            renderDialogueStep(); 

            if (startScrollTop > 0 && elements.fullDialogueContent) {
                setTimeout(() => {
                    elements.fullDialogueContent.scrollTop = startScrollTop;
                }, 100); 
            }

            elements.chapterLoadOverlay.classList.add('hidden');
            elements.loadText.textContent = i18n.ru.loadedText;
            setTimeout(() => {
                elements.loadText.textContent = i18n.ru.loadText;
                elements.loadButton.disabled = false;
            }, 1500);
        }

        function alertMessage(message) {
            const header = document.getElementById('header');
            if (!header) return;
            const msgBox = document.createElement('div');
            msgBox.textContent = message;
            msgBox.className = 'fixed top-1 right-1/2 translate-x-1/2 p-2 text-white rounded-lg shadow-xl z-50 text-sm transition-opacity duration-300 alert-message';
            msgBox.style.top = `${header.offsetHeight + 10}px`; 
            document.body.appendChild(msgBox);
            setTimeout(() => { msgBox.style.opacity = '0'; setTimeout(() => msgBox.remove(), 300); }, 5000);
        }

        function updateI18nStrings() {
            const text = i18n.ru;
            const headerTitle = document.getElementById('headerTitle');
            if (headerTitle) headerTitle.textContent = text.headerTitle;
            const labelStoryType = document.getElementById('labelStoryType');
            if (labelStoryType) labelStoryType.textContent = text.labelStoryType;
            const labelArc = document.getElementById('labelArc');
            if (labelArc) labelArc.textContent = text.labelArc; 
            const labelChapter = document.getElementById('labelChapter');
            if (labelChapter) labelChapter.textContent = text.labelChapter;
            
            if (elements.loadText) elements.loadText.textContent = text.loadText;
            if (elements.historyText) elements.historyText.textContent = text.historyButton;
            if (elements.historyTitle) elements.historyTitle.textContent = text.historyTitle;
            
            const currentTheme = document.body.classList.contains('dark-theme') ? 'dark' : 'light';
            if (elements.themeText) elements.themeText.textContent = currentTheme === 'dark' ? text.themeDark : text.themeLight;
        }
        
        function updateArcAndChapterUI() {
            updateI18nStrings(); 
            const typeKey = elements.storyTypeSelect.value;
            const arcSelect = elements.arcSelect;
            const arcContainer = elements.arcSelectContainer;
            
            arcSelect.innerHTML = '';
            
            if (typeKey === 'main') {
                arcContainer.classList.remove('hidden');
                for (const key in MAIN_STORY_ARCS) {
                    const option = document.createElement('option');
                    option.value = key; 
                    option.textContent = MAIN_STORY_ARCS[key].ru;
                    arcSelect.appendChild(option);
                }
                arcSelect.disabled = false;
            } else {
                arcContainer.classList.add('hidden');
                arcSelect.disabled = true;
            }
            updateChapterSelect();
        }

        function updateChapterSelect() {
            const typeKey = elements.storyTypeSelect.value;
            const arcKey = elements.arcSelect.value;       
            const select = elements.chapterSelect;
            
            select.innerHTML = '';
            select.disabled = true;
            
            if (!window.storyMetadata) return;
            
            const storyGroup = STORY_GROUPS[typeKey];
            if (!storyGroup) return;
            
            let targetPrefix = (typeKey === 'main') ? `${arcKey}_main_` : storyGroup.prefix; 
            
            let found = false;
            for (const key in window.storyMetadata) {
                if (key.startsWith(targetPrefix)) {
                    const option = document.createElement('option');
                    option.value = key;
                    option.textContent = window.storyMetadata[key].ru || key;
                    select.appendChild(option);
                    found = true;
                }
            }
            
            if (found) {
                select.disabled = false;
            }
            
            enableLoadButton();
        }
        
        function initializeOrUpdateUI() {
             populateStoryTypes();
             updateArcAndChapterUI(); 
             applyTheme(document.body.classList.contains('dark-theme') ? 'dark' : 'light');
             enableLoadButton();
        }

        function enableLoadButton() {
            if (elements.loadButton) {
                elements.loadButton.disabled = !elements.chapterSelect.value; 
            }
        }

        function toggleHistory() {
            isHistoryVisible = !isHistoryVisible;
            elements.historyPanel.classList.toggle('open', isHistoryVisible);
            if (isHistoryVisible) setTimeout(renderHistory, 300); 
        }

        function renderHistory() {
            const { historyContent } = elements;
            historyContent.innerHTML = '';
            
            if (!dialogueIsLoaded || currentDialogue.length === 0) {
                historyContent.innerHTML = `<p class="text-center mt-8 p-3 rounded-lg" style="color: var(--color-text-secondary); background-color: var(--color-bg-medium);">${i18n.ru.historyEmpty}</p>`;
                return;
            }
            
            const fragment = document.createDocumentFragment();
            for (let i = 0; i <= currentDialogueIndex; i++) {
                const step = currentDialogue[i];
                
                if (step.requires && !activeFlags.has(step.requires)) continue;
                if (!step.text && !step.background && !step.video && i !== 0) continue; 
                
                const isCurrent = (i === currentDialogueIndex);
                const historyItem = document.createElement('div');
                historyItem.className = `p-3 rounded-lg cursor-pointer transition duration-150 shadow-md border border-transparent`;
                
                if (isCurrent) {
                    historyItem.classList.add('ring-2', 'ring-offset-2');
                    historyItem.style.backgroundColor = 'var(--color-accent-primary)'; 
                    historyItem.style.color = 'white';
                    historyItem.style.borderColor = 'var(--color-accent-ring)';
                    historyItem.style.boxShadow = '0 0 10px rgba(0, 0, 0, 0.5)';
                    historyItem.style.fontWeight = 'bold';
                } else {
                    historyItem.style.backgroundColor = 'var(--color-bg-medium)'; 
                    historyItem.style.color = 'var(--color-text-primary)';
                }
                
                historyItem.onclick = () => {
                    initAudioContext();
                    currentDialogueIndex = i;
                    renderDialogueStep();
                    toggleHistory(); 
                };

                if (step.speaker && !step.video) {
                    const speakerName = document.createElement('p');
                    speakerName.className = 'font-bold mb-1';
                    speakerName.style.color = isCurrent ? 'white' : 'var(--color-speaker-name)'; 
                    speakerName.textContent = step.speaker;
                    historyItem.appendChild(speakerName);
                }

                const textContent = document.createElement('p');
                textContent.className = 'text-sm leading-snug';
                
                if (step.video) {
                    textContent.innerHTML = `<span class="italic opacity-80">[Воспроизведение видео: ${step.video}]</span>`;
                } else {
                    let displayText = step.text;
                    if (!displayText && i === 0) displayText = i18n.ru.startOfStory;
                    textContent.innerHTML = parseColoredText(processTextForBreaks(displayText || '')); 
                }
                
                historyItem.appendChild(textContent);
                fragment.appendChild(historyItem);
            }
            historyContent.appendChild(fragment);
            const currentItem = historyContent.lastElementChild;
            if (currentItem) currentItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    </script>
</body>
</html>
